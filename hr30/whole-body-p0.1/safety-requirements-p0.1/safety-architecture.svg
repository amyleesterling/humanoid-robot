<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="t d"><title id="t">HR-30 safety requirements architecture</title><desc id="d">Hardwired emergency stop and contactors remain independent of the standard motion controller and conversational agent.</desc><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#142a40}.h{font-size:34px;font-weight:900}.b{font-size:20px;font-weight:800}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.safe{fill:#fff3bd;stroke:#8a6200;stroke-width:5}.open{fill:#ffe6e3;stroke:#982520;stroke-width:4}.line{fill:none;stroke:#0b4f91;stroke-width:7}.hard{fill:none;stroke:#982520;stroke-width:9}</style><rect width="1600" height="920" fill="#f7fbff"/><rect x="35" y="25" width="1530" height="92" rx="14" fill="#f2b91d" stroke="#805600" stroke-width="3"/><text x="65" y="65" class="b">PRELIMINARY - SAFETY REQUIREMENTS CANDIDATE ONLY - NO VALIDATED PL OR WORK AUTHORITY</text><text x="65" y="96" class="s">E-stop/reset may restore eligibility only; neither may command motion.</text><text x="55" y="170" class="h">Independent stop path</text><rect x="55" y="205" width="260" height="150" rx="18" class="safe"/><text x="85" y="250" class="b">Dual E-stop</text><text x="85" y="285" class="s">two direct-opening channels</text><text x="85" y="318" class="s">manual reset is separate</text><rect x="435" y="205" width="280" height="150" rx="18" class="safe"/><text x="465" y="250" class="b">PNOZ s4 candidate</text><text x="465" y="285" class="s">monitored start + EDM</text><text x="465" y="318" class="s">candidate PLr d / Cat 3</text><rect x="835" y="205" width="280" height="150" rx="18" class="safe"/><text x="865" y="250" class="b">K1 + K2 series</text><text x="865" y="285" class="s">mirror contacts to EDM</text><text x="865" y="318" class="s">DC duty/test remains open</text><rect x="1235" y="205" width="300" height="150" rx="18" class="safe"/><text x="1265" y="250" class="b">25 actuator feeds</text><text x="1265" y="285" class="s">safe state: source removed</text><text x="1265" y="318" class="s">torque/current decay unmeasured</text><path d="M315 280 H435 M715 280 H835 M1115 280 H1235" class="hard"/><text x="55" y="455" class="h">Standard control path - no safety credit</text><rect x="55" y="490" width="300" height="150" rx="18" class="box"/><text x="85" y="535" class="b">OpenAI agent</text><text x="85" y="570" class="s">structured requests only</text><text x="85" y="603" class="s">no direct actuator bus</text><rect x="475" y="490" width="320" height="150" rx="18" class="box"/><text x="505" y="535" class="b">Deterministic controller</text><text x="505" y="570" class="s">25 torque bits / 8 TX paths</text><text x="505" y="603" class="s">first-power state inactive</text><rect x="915" y="490" width="300" height="150" rx="18" class="box"/><text x="945" y="535" class="b">Watchdog request</text><text x="945" y="570" class="s">diagnostic stop request</text><text x="945" y="603" class="s">cannot bypass E-stop</text><rect x="1335" y="490" width="200" height="150" rx="18" class="box"/><text x="1365" y="535" class="b">Actuators</text><text x="1365" y="570" class="s">not safety-rated</text><text x="1365" y="603" class="s">motion prohibited</text><path d="M355 565 H475 M795 565 H915 M1215 565 H1335" class="line"/><rect x="120" y="730" width="1360" height="125" rx="18" class="open"/><text x="150" y="775" class="b">Still open: achieved PL/PFHd, CCF, exact stopping time/distance, DC contactor duty, restraint proof and physical validation</text><text x="150" y="815" class="s">A qualified reviewer must accept one frozen as-built configuration before connection, powered testing, motion or energization.</text></svg>