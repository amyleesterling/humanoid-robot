<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">HR-30 physical tether power core</title><desc id="d">External enclosure with power supply, safety relay and two series contactors feeds a touch-safe tether and six fuse holders on the robot: one main and five PDU branches.</desc><style>text{font-family:system-ui,sans-serif;fill:#082f58}.box{fill:white;stroke:#0b5790;stroke-width:3}.ext{fill:#d8f1ff}.robot{fill:#fff4bf}.line{stroke:#0b5790;stroke-width:6;fill:none;marker-end:url(#a)}.h{font-size:25px;font-weight:800}.b{font-size:18px}.s{font-size:14px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#0b5790"/></marker></defs><rect width="1500" height="760" fill="#f7fcff"/><text x="45" y="48" class="h">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text><rect class="box ext" x="45" y="90" width="610" height="590" rx="24"/><text x="75" y="130" class="h">External 1418N4C6 panel candidate</text><rect class="box" x="80" y="175" width="220" height="105" rx="14"/><text x="100" y="212" class="h">RSP-500-12</text><text x="100" y="245" class="b">12 V · 41.7 A candidate</text><rect class="box" x="355" y="175" width="250" height="105" rx="14"/><text x="375" y="212" class="h">PNOZ s4 750104</text><text x="375" y="245" class="b">Dual channel + reset + EDM</text><rect class="box" x="95" y="360" width="190" height="100" rx="14"/><text x="120" y="400" class="h">K1 GV121CAC</text><rect class="box" x="365" y="360" width="190" height="100" rx="14"/><text x="390" y="400" class="h">K2 GV121CAC</text><path class="line" d="M190 280V350"/><path class="line" d="M285 410H355"/><rect class="box" x="170" y="530" width="350" height="90" rx="14"/><text x="200" y="568" class="h">SBS75G tether</text><text x="200" y="598" class="b">+12 V · return · pre-mate frame</text><path class="line" d="M460 460V520"/><rect class="box robot" x="780" y="90" width="675" height="590" rx="24"/><text x="810" y="130" class="h">Robot passive distribution assembly</text><rect class="box" x="825" y="180" width="210" height="95" rx="14"/><text x="850" y="218" class="h">FM0 main holder</text><text x="850" y="248" class="b">Fuse value: required</text><path class="line" d="M520 575H745V225H815"/><path class="line" d="M1035 225H1100"/><rect class="box" x="1110" y="170" width="285" height="400" rx="14"/><text x="1140" y="210" class="h">Five branch holders</text><text x="1140" y="255" class="b">FB1 → PDU-LLEG</text><text x="1140" y="310" class="b">FB2 → PDU-RLEG</text><text x="1140" y="365" class="b">FB3 → PDU-ARMS</text><text x="1140" y="420" class="b">FB4 → PDU-DISTAL</text><text x="1140" y="475" class="b">FB5 → PDU-CORE</text><text x="835" y="625" class="b">No fuse value or conductor is released. No contactor is on the robot.</text></svg>