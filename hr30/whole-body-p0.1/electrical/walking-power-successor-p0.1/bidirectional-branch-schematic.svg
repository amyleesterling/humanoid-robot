<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Paired HR-30 bidirectional actuator branch</title><desc id="desc">Two oppositely oriented TPS259482L eFuses connect one electrically isolated actuator-bus feed to one actuator. The forward device protects motoring current; the reverse-oriented device protects regenerative current. Eight bus-domain brake dumps remain required.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b5b9b"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a03921"/></marker></defs><style>text{font:600 19px system-ui;fill:#102a43}.h{font-size:34px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b5b9b;stroke-width:4}.gold{fill:#fff0ad;stroke:#8a6200;stroke-width:4}.hold{fill:#ffe4df;stroke:#a03921;stroke-width:4}.f{stroke:#0b5b9b;stroke-width:8;fill:none;marker-end:url(#a)}.r{stroke:#a03921;stroke-width:8;fill:none;marker-end:url(#r)}.wire{stroke:#183c5d;stroke-width:7}</style><rect width="1500" height="820" fill="#eef8ff"/><text class="h" x="55" y="60">HR-30 walking branch: protected in both directions</text><text x="55" y="102">A single bidirectional TPS25948 path is not enough: its OCP acts only from IN to OUT.</text><rect class="gold" x="55" y="180" width="230" height="120" rx="18"/><text x="92" y="232">One bus feed</text><text class="s" x="92" y="266">one of 8 isolated domains</text><path class="wire" d="M285 240H390"/><rect class="box" x="390" y="160" width="300" height="160" rx="20"/><text class="h" x="432" y="218">UxF</text><text x="432" y="256">TPS259482L</text><text class="s" x="432" y="288">IN=BUS / OUT=MID</text><path class="wire" d="M690 240H810"/><text x="732" y="222">MID</text><rect class="box" x="810" y="160" width="300" height="160" rx="20"/><text class="h" x="852" y="218">UxR</text><text x="852" y="256">TPS259482L</text><text class="s" x="852" y="288">IN=AXIS / OUT=MID</text><path class="wire" d="M1110 240H1215"/><rect class="gold" x="1215" y="180" width="230" height="120" rx="18"/><text x="1252" y="232">DYNAMIXEL</text><text class="s" x="1252" y="266">one local power pair</text><path class="f" d="M230 390H1260"/><text x="575" y="370">MOTORING: BUS to AXIS / UxF provides forward OCP</text><path class="r" d="M1260 500H230"/><text x="555" y="545">REGENERATION: AXIS to BUS / UxR provides forward OCP</text><rect class="hold" x="55" y="620" width="1390" height="130" rx="20"/><text class="h" x="92" y="671">Still required before walking</text><text x="92" y="715">Eight bus-domain brake/dump circuits, measured energy, exact thresholds, routed PCB, thermal proof and contactor-open timing.</text><text class="s" x="55" y="795">PRELIMINARY - WALKING-POWER ARCHITECTURE CANDIDATE ONLY - NOT APPROVED FOR PROCUREMENT, FABRICATION, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text></svg>