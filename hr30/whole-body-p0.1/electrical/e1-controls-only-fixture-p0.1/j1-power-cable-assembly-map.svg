<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">HR-30 E1 J1 logic-power cable assembly map</title><desc id="desc">Two 1000 mm Alpha Wire conductors connect red and black Pomona plugs to controller J1 contacts 2 and 1.</desc><style>text{font:600 18px system-ui;fill:#102b46}.title{font-size:36px;font-weight:900}.sub{font-size:22px;font-weight:800}.small{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.warn{fill:#fff0b5;stroke:#8d241f;stroke-width:4}.red{stroke:#b32025;stroke-width:10;fill:none}.black{stroke:#17243a;stroke-width:10;fill:none}</style><rect width="1400" height="700" fill="#eef8fe"/><text class="title" x="55" y="58">HR-30 E1 J1 logic-power cable candidate</text><rect class="warn" x="55" y="85" width="1290" height="65" rx="14"/><text x="80" y="125">UNBUILT / UNPOWERED - VERIFY POLARITY DE-ENERGIZED - NO CONNECTION OR POWER AUTHORITY</text><rect class="box" x="70" y="230" width="245" height="230" rx="18"/><text class="sub" x="105" y="280">Bench supply</text><text x="105" y="325">SPD3303X CH1 +</text><text x="105" y="400">SPD3303X CH1 -</text><path class="red" d="M315 320 H930"/><path class="black" d="M315 395 H930"/><text class="small" x="410" y="300">5934-2 / 3051 RD005 / 1000 mm / RED</text><text class="small" x="410" y="430">5934-0 / 3051 BK005 / 1000 mm / BLACK</text><rect class="box" x="930" y="235" width="360" height="220" rx="18"/><text class="sub" x="965" y="280">Controller J1 / VHR-2N</text><text x="965" y="325">J1.2 AUX_5V_SAFE (red)</text><text x="965" y="400">J1.1 CTRL_GND (black)</text><text class="small" x="70" y="535">Project-owned dimensional connector/plug envelopes; not manufacturer CAD.</text><text class="small" x="70" y="570">FIT-KIT-221BK sleeve and M21-11-427 labels are exact material candidates; process remains open.</text><text class="small" x="70" y="635">PRELIMINARY - UNBUILT J1 LOGIC-POWER CABLE CANDIDATE - NOT APPROVED FOR CONNECTION, POWERED TESTING, MOTION, WALKING, OR ENERGIZATION</text></svg>