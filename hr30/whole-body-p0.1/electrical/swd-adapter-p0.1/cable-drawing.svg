<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="t d"><title id="t">HR-30 SWD service cable</title><desc id="d">Five straight-through conductors between adapter J2 and motion-controller JDBG1. Candidate finished length 200 millimetres. Exact wire order code remains selection required.</desc><style>text{font:600 18px system-ui;fill:#12263a}.h{font-size:30px;font-weight:900}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}</style><rect width="1280" height="590" fill="#e7f7ff"/><text class="h" x="45" y="48">Five-contact SWD service cable - candidate 200 +/- 10 mm</text><text x="45" y="82">Two JST GHR-05V-S housings; SSHL-002T-P0.2 contacts; exact conductor order code and crimp process remain open.</text><rect class="box" x="60" y="120" width="210" height="400" rx="18"/><text x="95" y="150">Adapter J2</text><rect class="box" x="1000" y="120" width="220" height="400" rx="18"/><text x="1030" y="150">Controller JDBG1</text><line x1="300" y1="170" x2="980" y2="170" stroke="#1f2937" stroke-width="16"/><text x="325" y="156">1 BLACK - CTRL_GND</text><text x="90" y="177">J2.1</text><text x="1010" y="177">JDBG1.1</text><line x1="300" y1="242" x2="980" y2="242" stroke="#c62828" stroke-width="16"/><text x="325" y="228">2 RED - CTRL_3V3 / VTREF</text><text x="90" y="249">J2.2</text><text x="1010" y="249">JDBG1.2</text><line x1="300" y1="314" x2="980" y2="314" stroke="#0b63b6" stroke-width="16"/><text x="325" y="300">3 BLUE - SWDIO</text><text x="90" y="321">J2.3</text><text x="1010" y="321">JDBG1.3</text><line x1="300" y1="386" x2="980" y2="386" stroke="#d69a00" stroke-width="16"/><text x="325" y="372">4 YELLOW - SWCLK</text><text x="90" y="393">J2.4</text><text x="1010" y="393">JDBG1.4</text><line x1="300" y1="458" x2="980" y2="458" stroke="#f8fafc" stroke-width="16"/><text x="325" y="444">5 WHITE - MCU_NRST</text><text x="90" y="465">J2.5</text><text x="1010" y="465">JDBG1.5</text><text x="45" y="565">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, ASSEMBLY, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text></svg>