<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">HR-30 controlled SWD path</title><desc id="d">A separately powered controller connects through JDBG1 and a project adapter to STLINK-V3MINIE. Actuator carriers remain disconnected.</desc><style>text{font:600 18px system-ui;fill:#12263a}.h{font-size:28px;font-weight:900}.b{fill:#fff;stroke:#0b4f91;stroke-width:4}.hold{fill:#fff0b5;stroke:#982520;stroke-width:4}.a{stroke:#0b4f91;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:15px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0b4f91"/></marker></defs><text class="h" x="45" y="48">No-actuator SWD bring-up boundary</text><rect class="b" x="45" y="120" width="235" height="180" rx="18"/><text x="75" y="170">STLINK-V3MINIE</text><text class="s" x="75" y="205">CN4 / STDC14</text><text class="s" x="75" y="235">does not power target</text><rect class="hold" x="375" y="120" width="235" height="180" rx="18"/><text x="410" y="170">Project adapter</text><text class="s" x="410" y="205">native PCB designed</text><text class="s" x="410" y="235">7 STDC14 contacts</text><text class="s" x="410" y="265">unbuilt / uninspected</text><rect class="b" x="705" y="120" width="235" height="180" rx="18"/><text x="750" y="170">JDBG1</text><text class="s" x="740" y="205">JST GH 5-contact</text><text class="s" x="740" y="235">TVCC sense + SWD</text><rect class="b" x="1035" y="120" width="200" height="180" rx="18"/><text x="1062" y="170">STM32H743</text><text class="s" x="1062" y="205">separate logic supply</text><text class="s" x="1062" y="235">FIRST_POWER_</text><text class="s" x="1062" y="258">NO_MOTION</text><path class="a" d="M280 210H375"/><path class="a" d="M610 210H705"/><path class="a" d="M940 210H1035"/><rect class="hold" x="705" y="410" width="530" height="150" rx="18"/><text x="750" y="455">Actuator carriers, buses and power</text><text x="750" y="492">PHYSICALLY DISCONNECTED</text><text class="s" x="750" y="525">No software flag substitutes for this boundary.</text><path class="a" d="M1135 300V410" stroke-dasharray="12 10"/><text class="s" x="905" y="375">no connection</text></svg>