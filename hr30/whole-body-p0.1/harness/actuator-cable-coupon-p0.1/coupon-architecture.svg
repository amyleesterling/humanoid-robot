<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="t d"><title id="t">HR-30 actuator cable coupon workflow</title><desc id="d">Official candidate materials and tooling feed coupon construction and tests before any whole-robot cut length is allowed.</desc><rect width="1440" height="720" fill="#f7fbff"/><rect x="30" y="24" width="1380" height="94" rx="14" fill="#f2b91d" stroke="#805600" stroke-width="3"/><g font-family="system-ui" font-size="21" font-weight="800" fill="#17243a"><text x="60" y="64">PRELIMINARY - UNBUILT CABLE COUPON PLAN - NO PROCUREMENT, PRODUCTION CUTTING OR FABRICATION</text><text x="60" y="96">NO CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION AUTHORITY</text></g><g font-family="system-ui" fill="#142a40"><text x="60" y="170" font-size="34" font-weight="900">Power-wire candidates</text><rect x="60" y="200" width="350" height="180" rx="18" fill="#d9f2ff" stroke="#0b4f91" stroke-width="3"/><text x="85" y="245" font-size="22" font-weight="800">Static: Alpha 3051</text><text x="85" y="282" font-size="18">22 AWG, 1.575 mm OD</text><text x="85" y="315" font-size="18">Dynamic: CF130.03.02.UL</text><text x="85" y="348" font-size="18">2 x 22 AWG; sample required</text><text x="545" y="170" font-size="34" font-weight="900">Coupon evidence</text><rect x="500" y="200" width="420" height="180" rx="18" fill="#fff" stroke="#0b4f91" stroke-width="3"/><text x="530" y="245" font-size="18">strip + crimp section</text><text x="530" y="278" font-size="18">pull + retention</text><text x="530" y="311" font-size="18">resistance + temperature</text><text x="530" y="344" font-size="18">bend + torsion cycling</text><text x="1050" y="170" font-size="34" font-weight="900">Robot routing</text><rect x="1010" y="200" width="370" height="180" rx="18" fill="#fff" stroke="#982520" stroke-width="3"/><text x="1040" y="245" font-size="18">25 pull-string measurements</text><text x="1040" y="278" font-size="18">full joint sweeps</text><text x="1040" y="311" font-size="18">slack + clamps + bend radius</text><text x="1040" y="350" font-size="20" font-weight="900" fill="#982520">DO NOT CUT PRODUCTION CABLE</text><path d="M410 290 H500" stroke="#0b4f91" stroke-width="7" marker-end="url(#a)"/><path d="M920 290 H1010" stroke="#0b4f91" stroke-width="7" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b4f91"/></marker></defs><rect x="170" y="470" width="1100" height="150" rx="18" fill="#071d36"/><text x="720" y="514" text-anchor="middle" font-size="23" fill="#fff" font-weight="800">Promotion requires received-lot coupons + qualified disposition</text><text x="720" y="548" text-anchor="middle" font-size="23" fill="#fff" font-weight="800">plus measured robot routes</text><text x="720" y="582" text-anchor="middle" font-size="21" fill="#fff">0 coupons built  |  0 tests executed  |  0 final cut lengths released</text><text x="720" y="610" text-anchor="middle" font-size="18" fill="#f2b91d">No connection, powered test, motion, or energization authority</text></g></svg>