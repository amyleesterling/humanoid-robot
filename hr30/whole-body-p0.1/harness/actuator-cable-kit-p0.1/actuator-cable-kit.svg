<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">HR-30 fixed-side actuator power transition</title><desc id="desc">Each protected branch uses moving CF130 cable, a fixed panel-mounted Micro-Fit transition, a restrained Alpha 3051 pigtail and a JST EH actuator connector.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:34px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.power{stroke:#f2b91d;stroke-width:10;fill:none}.fixed{stroke:#982520;stroke-width:4;stroke-dasharray:12 8}.warn{fill:#fff0b5;stroke:#982520;stroke-width:4}</style><rect width="1600" height="900" fill="#eef8ff"/><text class="h" x="55" y="65">One of 25 actuator-power branches</text><rect class="box" x="55" y="190" width="260" height="190" rx="20"/><text x="88" y="235">Protected output</text><text class="s" x="88" y="280">individual VDD + return</text><text class="s" x="88" y="320">cap &lt;= 2.499 A candidate</text><path class="power" d="M315 285 H520"/><text x="350" y="255">CF130 moving pair</text><rect class="box" x="520" y="150" width="420" height="270" rx="20"/><text x="555" y="200">Fixed panel transition</text><text class="s" x="555" y="245">430250200 + 2 x 430300001</text><text class="s" x="555" y="285">mates with</text><text class="s" x="555" y="325">430200200 + 2 x 430310001</text><path class="fixed" d="M500 430 H960"/><text class="s" x="575" y="465">dimensioned bracket candidate / 25 nominal placements</text><path class="power" d="M940 285 H1135"/><text x="965" y="255">Alpha 3051 pigtail</text><rect class="box" x="1135" y="190" width="400" height="190" rx="20"/><text x="1170" y="235">JST EH actuator input</text><text class="s" x="1170" y="280">pin 1 return / pin 2 VDD</text><text class="s" x="1170" y="320">pigtail clamped; no joint flex</text><rect class="warn" x="110" y="570" width="1380" height="190" rx="20"/><text class="h" x="155" y="625">Candidate architecture, not a released cable</text><text x="155" y="675">Official cutout, received fit, clamp force, crimp, derating and thermal proof remain open.</text><text x="155" y="715">No procurement, fabrication, connection, powered testing, motion or energization authority.</text><text class="s" x="55" y="850">PRELIMINARY - UNBUILT ACTUATOR CABLE-KIT CANDIDATE - NOT APPROVED FOR PROCUREMENT, FABRICATION, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text></svg>