<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">HR-30 eight-bus single-point reference candidate</title><desc id="desc">Five isolated RS-485 and three non-isolated TTL controller channels reference actuator branches at one pelvis return star. No ground or voltage conductor is daisy chained between actuators.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:34px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.star{fill:#f2b91d;stroke:#805600;stroke-width:4}.data{stroke:#28a9df;stroke-width:8;fill:none}.ret{stroke:#0b4f91;stroke-width:8;fill:none}.empty{stroke:#982520;stroke-width:6;stroke-dasharray:12 9;fill:none}.hold{fill:#fff0b5;stroke:#982520;stroke-width:4}</style><rect width="1600" height="980" fill="#eef8ff"/><text class="h" x="55" y="65">Eight-bus single-point reference candidate</text><rect class="box" x="55" y="150" width="390" height="260" rx="20"/><text x="90" y="200">Controller carriers</text><text class="s" x="90" y="245">5 x ISOW1432 isolated RS-485</text><text class="s" x="90" y="285">3 x SN74LVC1T45 TTL</text><text class="s" x="90" y="325">TTL channels are not isolated</text><path class="data" d="M445 240 H720"/><path class="data" d="M445 315 H720"/><rect class="box" x="720" y="130" width="380" height="320" rx="20"/><text x="755" y="180">Actuator bus</text><text class="s" x="755" y="225">data conductor(s) continue</text><text class="s" x="755" y="270">each actuator pin 1 uses its</text><text class="s" x="755" y="305">own branch-return conductor</text><text class="s" x="755" y="350">outgoing pin 1: EMPTY</text><text class="s" x="755" y="385">outgoing pin 2: EMPTY</text><path class="ret" d="M910 450 V610 H540"/><rect class="star" x="405" y="565" width="270" height="100" rx="50"/><text x="445" y="625">PDU_COMMON_RET</text><path class="ret" d="M405 615 H250 V410"/><path class="empty" d="M1100 285 H1470"/><text class="s" x="1140" y="250">No daisy GND or VDD path</text><text class="s" x="1120" y="330">prevents parallel motor return</text><rect class="hold" x="110" y="745" width="1380" height="150" rx="20"/><text x="155" y="795">This selects topology only. RS-485 common-mode, TTL logic margins, regeneration and open-return faults are untested.</text><text x="155" y="840">No connection or powered-work authority follows from this diagram.</text><text class="s" x="55" y="945">PRELIMINARY - UNBUILT ACTUATOR CABLE-KIT CANDIDATE - NOT APPROVED FOR PROCUREMENT, FABRICATION, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text></svg>