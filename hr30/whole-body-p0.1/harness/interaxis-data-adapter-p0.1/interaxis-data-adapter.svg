<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">HR-30 inter-axis data adapter candidate</title><desc id="desc">A factory ROBOTIS data cable has its GND and VDD conductors removed. The upstream actuator housing keeps cavities one and two empty; the destination housing receives that actuator's dedicated branch power contacts while factory data contacts remain.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:34px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.empty{fill:#fff0b5;stroke:#982520;stroke-width:4}.data{stroke:#28a9df;stroke-width:10;fill:none}.power{stroke:#f2b91d;stroke-width:10;fill:none}.ret{stroke:#0b4f91;stroke-width:10;fill:none}</style><rect width="1600" height="900" fill="#eef8ff"/><text class="h" x="55" y="65">Adapt the cable; do not daisy-chain actuator power</text><rect class="box" x="60" y="150" width="430" height="330" rx="20"/><text x="95" y="200">Upstream actuator output housing</text><rect class="empty" x="110" y="245" width="100" height="62" rx="12"/><text x="145" y="285">1</text><rect class="empty" x="230" y="245" width="100" height="62" rx="12"/><text x="265" y="285">2</text><rect class="box" x="110" y="330" width="100" height="62" rx="12"/><text x="145" y="370">3</text><rect class="box" x="230" y="330" width="100" height="62" rx="12"/><text x="265" y="370">4</text><text class="s" x="105" y="435">Cavities 1/2 EMPTY; data only</text><path class="data" d="M330 350 C600 350 750 350 1030 350"/><path class="data" d="M330 385 C600 385 750 385 1030 385"/><rect class="box" x="1030" y="150" width="500" height="330" rx="20"/><text x="1065" y="200">Destination combined input housing</text><rect class="box" x="1080" y="245" width="100" height="62" rx="12"/><text x="1115" y="285">1</text><rect class="box" x="1200" y="245" width="100" height="62" rx="12"/><text x="1235" y="285">2</text><rect class="box" x="1080" y="330" width="100" height="62" rx="12"/><text x="1115" y="370">3</text><rect class="box" x="1200" y="330" width="100" height="62" rx="12"/><text x="1235" y="370">4</text><path class="ret" d="M1130 245 V110"/><path class="power" d="M1250 245 V110"/><text class="s" x="1330" y="265">1 dedicated return</text><text class="s" x="1330" y="300">2 dedicated VDD</text><text class="s" x="1330" y="355">3/4 factory data</text><rect x="115" y="585" width="1370" height="180" rx="20" fill="#fff0b5" stroke="#982520" stroke-width="4"/><text x="160" y="635">Remove both factory GND/VDD conductors completely; never cut them flush or leave hidden live ends.</text><text x="160" y="680">Insert only the destination actuator's separately qualified branch-power contacts into cavities 1 and 2.</text><text x="160" y="725">All extraction, retention, routing, no-backfeed and communication tests remain unexecuted.</text><text class="s" x="55" y="850">PRELIMINARY - UNBUILT INTER-AXIS DATA ADAPTER CANDIDATE - NOT APPROVED FOR PROCUREMENT, MODIFICATION, ASSEMBLY, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text></svg>