<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 330" role="img" aria-labelledby="title desc"><title id="title">RS-LLEG serial data and individual power harness</title><desc id="desc">Serial data chain through each actuator with separate VDD and return pair at each actuator. Outgoing ground and VDD cavities remain empty.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#179de3"/></marker><marker id="arrowGold" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d99a00"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#0d2d57}.title{font-weight:700;font-size:17px}.controller{fill:#d8f1ff;stroke:#123f73;stroke-width:3}.node{fill:white;stroke:#123f73;stroke-width:3}.data{stroke:#179de3;stroke-width:5}.power{stroke:#d99a00;stroke-width:5}</style><rect width="100%" height="100%" fill="#f8fcff"/><text x="24" y="36" class="title">RS-LLEG / RS-485 HALF-DUPLEX / 6 axes</text><rect x="24" y="92" width="180" height="128" rx="16" class="controller"/><text x="40" y="122" class="title">CONTROLLER</text><text x="40" y="150">Data-only JST GH</text><text x="40" y="176">No actuator VDD</text><text x="40" y="202">Reference star tie open</text><line x1="204" y1="150" x2="250" y2="150" class="data" marker-end="url(#arrow)"/><line x1="342" y1="278" x2="342" y2="242" class="power" marker-end="url(#arrowGold)"/><text x="266" y="302">Individual VDD + return pair</text><line x1="434" y1="150" x2="470" y2="150" class="data" marker-end="url(#arrow)"/><line x1="562" y1="278" x2="562" y2="242" class="power" marker-end="url(#arrowGold)"/><text x="486" y="302">Individual VDD + return pair</text><line x1="654" y1="150" x2="690" y2="150" class="data" marker-end="url(#arrow)"/><line x1="782" y1="278" x2="782" y2="242" class="power" marker-end="url(#arrowGold)"/><text x="706" y="302">Individual VDD + return pair</text><line x1="874" y1="150" x2="910" y2="150" class="data" marker-end="url(#arrow)"/><line x1="1002" y1="278" x2="1002" y2="242" class="power" marker-end="url(#arrowGold)"/><text x="926" y="302">Individual VDD + return pair</text><line x1="1094" y1="150" x2="1130" y2="150" class="data" marker-end="url(#arrow)"/><line x1="1222" y1="278" x2="1222" y2="242" class="power" marker-end="url(#arrowGold)"/><text x="1146" y="302">Individual VDD + return pair</text><line x1="1314" y1="150" x2="1350" y2="150" class="data" marker-end="url(#arrow)"/><line x1="1442" y1="278" x2="1442" y2="242" class="power" marker-end="url(#arrowGold)"/><text x="1366" y="302">Individual VDD + return pair</text><line x1="1534" y1="150" x2="1570" y2="150" class="data"/><text x="1568" y="142" text-anchor="end">FAR END / termination open</text><rect x="250" y="70" width="184" height="172" rx="16" class="node"/><text x="266" y="101" class="title">L_HIP_YAW</text><text x="266" y="129">Input: power pair + data</text><text x="266" y="157">Pin 1 return / Pin 2 VDD</text><text x="266" y="185">Outgoing: data only</text><text x="266" y="213">Outgoing pins 1/2 EMPTY</text><rect x="470" y="70" width="184" height="172" rx="16" class="node"/><text x="486" y="101" class="title">L_HIP_ROLL</text><text x="486" y="129">Input: power pair + data</text><text x="486" y="157">Pin 1 return / Pin 2 VDD</text><text x="486" y="185">Outgoing: data only</text><text x="486" y="213">Outgoing pins 1/2 EMPTY</text><rect x="690" y="70" width="184" height="172" rx="16" class="node"/><text x="706" y="101" class="title">L_HIP_PITCH</text><text x="706" y="129">Input: power pair + data</text><text x="706" y="157">Pin 1 return / Pin 2 VDD</text><text x="706" y="185">Outgoing: data only</text><text x="706" y="213">Outgoing pins 1/2 EMPTY</text><rect x="910" y="70" width="184" height="172" rx="16" class="node"/><text x="926" y="101" class="title">L_KNEE_PITCH</text><text x="926" y="129">Input: power pair + data</text><text x="926" y="157">Pin 1 return / Pin 2 VDD</text><text x="926" y="185">Outgoing: data only</text><text x="926" y="213">Outgoing pins 1/2 EMPTY</text><rect x="1130" y="70" width="184" height="172" rx="16" class="node"/><text x="1146" y="101" class="title">L_ANKLE_PITCH</text><text x="1146" y="129">Input: power pair + data</text><text x="1146" y="157">Pin 1 return / Pin 2 VDD</text><text x="1146" y="185">Outgoing: data only</text><text x="1146" y="213">Outgoing pins 1/2 EMPTY</text><rect x="1350" y="70" width="184" height="172" rx="16" class="node"/><text x="1366" y="101" class="title">L_ANKLE_ROLL</text><text x="1366" y="129">Input: power pair + data</text><text x="1366" y="157">Pin 1 return / Pin 2 VDD</text><text x="1366" y="185">Outgoing: data only</text><text x="1366" y="213">Outgoing pins 1/2 EMPTY</text></svg>