<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">HR-30 head HMI harness candidate</title><desc id="desc">Torso Raspberry Pi links to two head cameras, face display, split microphone and audio system, two speakers and fan.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:32px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.data{stroke:#28a9df;stroke-width:8;fill:none}.power{stroke:#f2b91d;stroke-width:9;fill:none}.audio{stroke:#6942a7;stroke-width:8;fill:none}.open{stroke:#982520;stroke-width:5;stroke-dasharray:14 9;fill:none}.warn{fill:#fff0b5;stroke:#982520;stroke-width:4}</style><rect width="1600" height="980" fill="#eef8ff"/><text class="h" x="45" y="55">HR-30 head HMI physical harness candidate</text><rect class="box" x="55" y="140" width="310" height="330" rx="20"/><text x="85" y="185">Torso Raspberry Pi 5</text><text class="s" x="85" y="225">CAM/DISP0 → left camera</text><text class="s" x="85" y="260">CAM/DISP1 → right camera</text><text class="s" x="85" y="295">HDMI0 → face display</text><text class="s" x="85" y="330">USB 2.0 → audio core</text><text class="s" x="85" y="365">GPIO breakout → touch</text><rect class="box" x="1180" y="105" width="350" height="160" rx="20"/><text x="1215" y="150">Two Camera Module 3 Wide</text><text class="s" x="1215" y="190">Pi 5 22-way → camera 15-pin</text><text class="s" x="1215" y="225">300 mm Standard-Mini candidates</text><rect class="box" x="1180" y="310" width="350" height="150" rx="20"/><text x="1215" y="355">Waveshare face display</text><text class="s" x="1215" y="395">micro-HDMI + protected 5 V</text><text class="s" x="1215" y="430">remote SPI touch; no stacking</text><rect class="box" x="690" y="560" width="380" height="180" rx="20"/><text x="725" y="605">reSpeaker Flex XVF3800 core</text><text class="s" x="725" y="645">locking USB + protected 12 V</text><text class="s" 