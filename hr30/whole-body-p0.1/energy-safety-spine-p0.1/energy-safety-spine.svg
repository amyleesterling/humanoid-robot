<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">HR-30 tether-first energy and safety spine</title><desc id="d">External mains enclosure containing supply, safety relay and two series contactors feeding the robot power distribution and regulated rails.</desc><style>text{font-family:Arial,sans-serif;fill:#0d2d57}.box{fill:#fff;stroke:#123f73;stroke-width:3}.safe{fill:#d8f1ff}.hold{fill:#fff2bf}.line{stroke:#123f73;stroke-width:5;fill:none;marker-end:url(#a)}.dash{stroke:#d79800;stroke-dasharray:10 8}.h{font-size:22px;font-weight:700}.b{font-size:16px}.s{font-size:14px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#123f73"/></marker></defs><rect width="1400" height="720" rx="28" fill="#f7fcff"/><text x="42" y="50" class="h">Tether-first P0.1: high-energy and mains equipment stays in the external panel</text><rect class="box hold" x="40" y="90" width="515" height="550" rx="22"/><text x="68" y="130" class="h">Qualified external enclosure</text><rect class="box" x="75" y="170" width="190" height="105" rx="16"/><text x="95" y="205" class="h">RSP-500-12</text><text x="95" y="235" class="b">12 V / 41.7 A candidate</text><text x="95" y="260" class="s">Mains/PE/protection open</text><rect class="box safe" x="315" y="170" width="205" height="105" rx="16"/><text x="335" y="205" class="h">PNOZ s4</text><text x="335" y="235" class="b">E-stop + manual reset</text><text x="335" y="260" class="s">EDM / validation open</text><rect class="box" x="75" y="340" width="180" height="100" rx="16"/><text x="100" y="378" class="h">K1</text><text x="100" y="410" class="b">DC contactor</text><rect class="box" x="325" y="340" width="180" height="100" rx="16"/><text x="350" y="378" class="h">K2</text><text x="350" y="410" class="b">DC contactor</text><path class="line" d="M265 222H305"/><path class="line dash" d="M420 275V330"/><path class="line" d="M165 275V330"/><path class="line" d="M255 390H315"/><rect class="box safe" x="75" y="500" width="430" height="100" rx="16"/><text x="98" y="535" class="h">Touch-safe tether boundary</text><text x="98" y="567" class="b">strain relief / breakaway / rating: SELECTION REQUIRED</text><path class="line" d="M415 440V490"/><rect class="box safe" x="660" y="90" width="700" height="550" rx="22"/><text x="690" y="130" class="h">HR-30 robot</text><rect class="box" x="705" y="180" width="220" height="105" rx="16"/><text x="730" y="216" class="h">Five PDU boards</text><text x="730" y="246" class="b">25 actuator branch slots</text><text x="730" y="270" class="s">all values unresolved</text><path class="line" d="M505 550H650V232H695"/><rect class="box" x="1010" y="155" width="290" height="105" rx="16"/><text x="1035" y="193" class="h">19 XH/XM feeds</text><text x="1035" y="225" class="b">controlled 12 V main rail</text><path class="line" d="M925 220H1000"/><rect class="box" x="1010" y="310" width="290" height="115" rx="16"/><text x="1035" y="348" class="h">6 XC330 feeds</text><text x="1035" y="380" class="b">three 9 V regulators</text><text x="1035" y="406" class="s">2 A typical each; proof open</text><path class="line" d="M925 235H965V367H1000"/><rect class="box hold" x="705" y="485" width="595" height="110" rx="16"/><text x="730" y="522" class="h">Onboard later: BLF-1209WS LiFePO4 candidate</text><text x="730" y="554" class="b">18 A continuous / 40 A for 2 s &lt; 60.58 A provisional peak</text><text x="730" y="580" class="s">cassette, interruption, charge and fault architecture remain open</text></svg>