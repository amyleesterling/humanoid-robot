<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Project Button HR-V0 control-panel candidate P0.6</title>
  <desc id="desc">Catalog-envelope planning view of the enlarged Hammond 18P2721 inner panel with inherited electrical allocations, a separated Raspberry Pi case column, U2D2 retention and two cable-loop retention positions. No holes, fabrication or energization are released.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#082b4c;font-size:18px}.title{font-size:34px;font-weight:800}.subtitle{font-size:24px;font-weight:800}.label{font-size:16px;font-weight:700}.small{font-size:14px}.warn{font-size:20px;font-weight:800;fill:#7a3500}.panel{fill:#fff;stroke:#0b4f8a;stroke-width:4}.duct{fill:#d8ecfb;stroke:#0b4f8a;stroke-width:2}.legacy{fill:#e5f7ee;stroke:#17663b;stroke-width:2}.compute{fill:#fff3cc;stroke:#c48700;stroke-width:3}.hold{fill:#ffe4d6;stroke:#a03c17;stroke-width:2}.reserve{fill:#f3eefc;stroke:#6746a0;stroke-width:2;stroke-dasharray:9 7}.rail{stroke:#333;stroke-width:8}.leader{fill:none;stroke:#0b4f8a;stroke-width:2}.dim{fill:none;stroke:#567;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
