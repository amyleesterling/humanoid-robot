  <text x="940" y="280" class="subtitle">What P0.6 fixes</text>
  <text x="940" y="325">• Replaces the too-small P0.5 cabinet candidate.</text>
  <text x="940" y="365">• Gives the compute stack its own separated column.</text>
  <text x="940" y="405">• Keeps protection and future-fit reserves visible.</text>
  <text x="940" y="455" class="subtitle">What remains open</text>
  <text x="940" y="500">• Every hole, cut, fastener, cable and entry fitting.</text>
  <text x="940" y="540">• Rail engagement, U2D2 retention and cable pull.</text>
  <text x="940" y="580">• Depth, bend space, duct fill and service access.</text>
  <text x="940" y="620">• Grounding, shields, EMC and enclosure heat rise.</text>
  <text x="940" y="660">• Qualified electrical and enclosure-system review.</text>
  <text x="940" y="710" class="warn">NO FABRICATION OR ENERGIZATION AUTHORITY</text>
  <text x="55" y="1045" class="small">HR-V0-CP-P0.6 · HR-V0-COMPUTE-INSTALL-P0.1 · 2026-08-08 · catalog-envelope planning view</text>
