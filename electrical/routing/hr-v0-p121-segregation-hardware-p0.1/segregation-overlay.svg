<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" role="img" aria-labelledby="title desc"><title id="title">WD5 segregation hardware planning overlay</title><desc id="desc">A scaled plan view of the candidate panel showing separate WD1, WD5 and WD2 corridor envelopes.</desc><style>text{font-family:Arial,sans-serif;fill:#082b4c;font-size:16px}.small{font-size:14px}.label{font-weight:700}.box{fill:#fff;stroke:#082b4c;stroke-width:3}.duct{fill:#8bd7f7;stroke:#1268a8;stroke-width:3}.hot{fill:#f3b61f;stroke:#8a6100;stroke-width:3}.hold{fill:#fff1bd;stroke:#9b6d00;stroke-width:3;stroke-dasharray:8 5}</style><rect width="980" height="760" fill="#f7fbfe"/><text x="40" y="42" class="label">HR-V0-P121-SEGREGATION-HW-P0.1 · scaled planning view</text><rect x="155" y="65" width="533.4" height="685.8" class="box"/><text x="700" y="90" class="small">Usable backplate</text><rect x="163" y="75" width="40" height="665.8" class="duct"/><line x1="110" y1="150" x2="163" y2="150" stroke="#1268a8" stroke-width="3"/><text x="35" y="140" class="label">WD1</text><text x="35" y="165" class="small">credited input</text><rect x="209" y="75" width="369.8" height="25" class="hot"/><text x="220" y="94" class="label">WD5 · 3240187 · 25 × 25</text><rect x="209" y="110" width="323.8" height="7.5" fill="#b9c5cf" stroke="#52606b" stroke-width="2"/><text x="220" y="137" class="small">10 mm gap to DR1; 20 mm to devices</text><rect x="538.8" y="75" width="40" height="665.8" class="duct"/><line x1="578.8" y1="150" x2="610" y2="150" stroke="#1268a8" stroke-width="3"/><text x="620" y="142" class="label">WD2</text><text x="620" y="167" class="small">mixed occupancy</text><rect x="538.8" y="75" width="40" height="25" class="hold"/><line x1="578.8" y1="88" x2="780" y2="210" stroke="#9b6d00" stroke-width="3"/><rect x="700" y="190" width="240" height="120" rx="10" class="hold"/><text x="718" y="220" class="label">Junction hold</text><text x="718" y="248">Exact breakout, ribs,</text><text x="718" y="274">edges, cover and clips</text><text x="718" y="300">SELECTION REQUIRED</text><rect x="209" y="175" width="369.8" height="430" fill="#fff" stroke="#8294a4" stroke-width="2" stroke-dasharray="6 6"/><text x="220" y="205">Device region begins y = 55 mm</text><text x="40" y="710" class="small">Duct envelopes are not released cut geometry and establish no functional-safety credit.</text><text x="40" y="738" class="small">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, ASSEMBLY, CONNECTION, POWERED TESTING, MOTION, OR ENERGIZATION</text></svg>