<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 950 760' role='img' aria-labelledby='title desc'><title id='title'>Carrier datum overlay</title><desc id='desc'>P0.7 nominal backplate with three rotated carrier envelopes, mounting centers and connector anchors.</desc><style>text{font-family:system-ui,sans-serif;fill:#092f57}.title{font-size:24px;font-weight:800}.note{font-size:17px;font-weight:700}.label{font-size:18px;font-weight:800}.small{font-size:14px}.panel{fill:#f8fbfe;stroke:#092f57;stroke-width:3}.duct{fill:#d8e7f2;stroke:#396987}.board{fill:#dff3ff;stroke:#075ea8;stroke-width:3}.hole{fill:white;stroke:#092f57;stroke-width:2}.jin{fill:#f3bd28;stroke:#092f57;stroke-width:2}.jout{fill:#ff8a65;stroke:#092f57;stroke-width:2}</style><rect width='950' height='760' fill='white'/><text x='35' y='35' class='title'>P0.7 carrier datum screen - NOT A DRILL TEMPLATE</text><g transform='translate(40 55)'><rect x='0' y='0' width='533.4' height='685.8' class='panel'/><rect x='383.8' y='0' width='40' height='685.8' class='duct'/><text x='387' y='30' class='small'>WD2</text><rect x='54' y='625' width='323.8' height='40' class='duct'/><text x='65' y='652' class='small'>WD4</text><g data-carrier='LIM1'><rect x='438' y='300' width='60' height='100' rx='4' class='board'/><circle cx='493' cy='305' r='4' class='hole'/><circle cx='493' cy='395' r='4' class='hole'/><circle cx='443' cy='305' r='4' class='hole'/><circle cx='443' cy='395' r='4' class='hole'/><circle cx='468' cy='308' r='5' class='jin'/><circle cx='468' cy='392' r='5' class='jout'/><text x='448' y='348' class='label'>LIM1</text><text x='448' y='368' class='small'>90 deg</text></g><g data-carrier='LIM2'><rect x='438' y='410' width='60' height='100' rx='4' class='board'/><circle cx='493' cy='415' r='4' class='hole'/><circle cx='493' cy='505' r='4' class='hole'/><circle cx='443' cy='415' r='4' class='hole'/><circle cx='443' cy='505' r='4' class='hole'/><circle cx='468' cy='418' r='5' class='jin'/><circle cx='468' cy='502' r='5' class='jout'/><text x='448' y='458' class='label'>LIM2</text><text x='448' y='478' class='small'>90 deg</text></g><g data-carrier='LIM3'><rect x='438' y='520' width='60' height='100' rx='4' class='board'/><circle cx='493' cy='525' r='4' class='hole'/><circle cx='493' cy='615' r='4' class='hole'/><circle cx='443' cy='525' r='4' class='hole'/><circle cx='443' cy='615' r='4' class='hole'/><circle cx='468' cy='528' r='5' class='jin'/><circle cx='468' cy='612' r='5' class='jout'/><text x='448' y='568' class='label'>LIM3</text><text x='448' y='588' class='small'>90 deg</text></g></g><g transform='translate(605 100)'><circle cx='0' cy='0' r='6' class='hole'/><text x='14' y='6' class='note'>hole datum</text><circle cx='0' cy='45' r='7' class='jin'/><text x='14' y='51' class='note'>JIN1</text><circle cx='0' cy='90' r='7' class='jout'/><text x='14' y='96' class='note'>JOUT1</text></g><text x='605' y='250' class='note'>Coordinates are</text><text x='605' y='275' class='note'>nominal centers.</text><text x='605' y='320' class='note'>No hole diameter.</text><text x='605' y='345' class='note'>No wire exit.</text><text x='605' y='390' class='note'>Measure received</text><text x='605' y='415' class='note'>parts first.</text></svg>