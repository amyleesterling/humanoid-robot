<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><style>text{font-family:Arial,sans-serif;fill:#082b4c;font-size:18px}.title{font-size:36px;font-weight:700}.head{font-size:24px;font-weight:700}.warn{font-size:20px;font-weight:700;fill:#7a3500}.card{fill:#f7fbff;stroke:#0b4f8a;stroke-width:3}.hold{fill:#fff5d8;stroke:#d59600;stroke-width:3}.arrow{stroke:#0b4f8a;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b4f8a"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><text x="60" y="70" class="title">HR-V0 physical-evidence acquisition decision path</text><text x="60" y="112" class="warn">HR-V0-EVAL-ACQ-P0.1 / NO ORDER OR WORK AUTHORIZATION</text><rect x="60" y="160" width="430" height="235" rx="16" class="card"/><text x="90" y="210" class="head">1. Exact evaluation articles</text><text x="90" y="255">2 x XM540-W270-T</text><text x="90" y="295">2 x FR13-H101K</text><text x="90" y="335">2 x FR13-S102K</text><text x="90" y="375">Web subtotal: $1,182.22 before extras</text><path d="M500 275 H575" class="arrow"/><rect x="590" y="160" width="430" height="235" rx="16" class="hold"/><text x="620" y="210" class="head">2. Two independent decisions</text><text x="620" y="255">Program owner: exact purchase ceiling</text><text x="620" y="295">Qualified reviewer: provider/method</text><text x="620" y="335">Stock, shipping, tax and scope verified</text><text x="620" y="375">All ten hold points signed</text><path d="M1030 275 H1105" class="arrow"/><rect x="1120" y="160" width="420" height="235" rx="16" class="card"/><text x="1150" y="210" class="head">3. Controlled physical evidence</text><text x="1150" y="255">Receive and quarantine</text><text x="1150" y="295">Unpowered metrology only</text><text x="1150" y="335">Raw data, uncertainty and hashes</text><text x="1150" y="375">Qualified disposition; no build release</text><rect x="60" y="455" width="1480" height="430" rx="16" class="card"/><text x="90" y="510" class="head">Current provider routes</text><text x="90" y="560">ECM / Topsfield: primary CMM and dimensional quote candidate; exact accredited scope must be proven.</text><text x="90" y="610">Celero / Woburn: envelope-scan candidate; published resolution is not uncertainty or traceability.</text><text x="90" y="660">3D ProScan / Clinton: CT/scan/dimensional candidate; ISO 9001 is not an ISO/IEC 17025 scope.</text><text x="90" y="710">Artisans Asylum / Allston: fixture, training and loose inspection inquiry only; no traceable metrology inferred.</text><text x="90" y="775">All four remain NOT CONTACTED and NOT SELECTED. The 24-question response register must be completed.</text><text x="90" y="835" class="warn">No order button exists. No provider may begin work from this diagram.</text><rect x="60" y="935" width="1480" height="90" rx="16" class="hold"/><text x="90" y="992" class="warn">Do not order, ship, assemble, connect, move or energize until the applicable signed holds close.</text></svg>