<rect x="55" y="840" width="1490" height="150" fill="#fff" stroke="#8b1e1e" stroke-width="3"/><text x="85" y="885" class="w">DO NOT BUILD OR POWER FROM THIS LAYOUT.</text><text x="85" y="930">This route characterizes an actuator against a brake; it does not reproduce the final FR12-H101 configured joint.</text><text x="85" y="970">Manufacturer application acceptance, qualified design, full guarding and a separate powered-work authorization are mandatory.</text></svg>