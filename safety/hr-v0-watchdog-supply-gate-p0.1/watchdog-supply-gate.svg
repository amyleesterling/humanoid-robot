<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img"><style>text{font-family:Arial,sans-serif;fill:#082b4c;font-size:18px}.title{font-size:34px;font-weight:800}.head{font-size:24px;font-weight:800}.warn{fill:#7a3500;font-size:20px;font-weight:800}.s{fill:#e4f6ee;stroke:#17663b;stroke-width:4}.d{fill:#fff3cc;stroke:#c48700;stroke-width:4}</style><rect width="1600" height="760" fill="#e7f6ff"/><text x="50" y="58" class="title">HR-V0 watchdog supply-gate correction</text><text x="50" y="98" class="warn">PRELIMINARY - ANALYSIS AND UNEXECUTED TEST CONTROL ONLY - NOT APPROVED FOR FABRICATION OR ENERGIZATION</text><rect x="50" y="155" width="650" height="235" rx="18" class="s"/><text x="80" y="205" class="head">Credited candidate path: direct E-stop</text><text x="80" y="260">SR1:S11 - S0 channel 1 NC - SR1:S12</text><text x="80" y="305">SR1:S21 - S0 channel 2 NC - SR1:S22</text><text x="80" y="350">No KWD terminal in either input return</text><rect x="790" y="155" width="760" height="235" rx="18" class="d"/><text x="820" y="205" class="head">Ordinary diagnostic gate: ZERO SAFETY CREDIT</text><text x="820" y="260">SAFETY_24V - KWD1:11/14 - KWD2:11/14 - SR1:A1</text><text x="820" y="305">A welded/shorted contact can defeat DF-01 availability</text><text x="820" y="350">It does not connect directly to S0 returns in P1.13</text><rect x="50" y="455" width="1500" height="230" rx="18" fill="#f5fbff" stroke="#0b4f8a" stroke-width="3"/><text x="80" y="505" class="head">Release boundary</text><text x="80" y="555">Encoded internal injection path removed. Physical noninterference: NOT PROVED.</text><text x="80" y="600">Contact duty, protection, routing, brownout, reset recovery and fault injection: OPEN.</text><text x="80" y="645" class="warn">NOT APPROVED FOR FABRICATION, ENERGIZATION OR MOTION.</text></svg>