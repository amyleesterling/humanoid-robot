<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><style>text{font-family:Arial,sans-serif;fill:#082b4c;font-size:18px}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.warn{font-size:20px;font-weight:700;fill:#7a3500}.box{fill:#f4faff;stroke:#0b4f8a;stroke-width:3}.block{fill:#fff3cc;stroke:#c48700;stroke-width:4}.line{stroke:#0b4f8a;stroke-width:4;fill:none}.red{stroke:#b42318;stroke-width:5;stroke-dasharray:12 8;fill:none}</style><rect width="1600" height="980" fill="#eef8ff"/><text x="60" y="60" class="title">HR-V0 watchdog non-interference boundary</text><text x="60" y="100" class="warn">PRELIMINARY - ANALYSIS AND UNEXECUTED TEST CONTROL ONLY - NOT APPROVED FOR FABRICATION OR ENERGIZATION</text><rect x="60" y="160" width="330" height="150" rx="16" class="box"/><text x="85" y="205" class="head">Credited candidate SF-01</text><text x="85" y="245">SR1 S11 / S21</text><text x="85" y="280">E-stop S0 dual NC</text><path d="M390 235 H520" class="line"/><rect x="520" y="160" width="400" height="150" rx="16" class="block"/><text x="545" y="205" class="head">Ordinary KWD boundary</text><text x="545" y="245">11-14 contact in each return</text><text x="545" y="280">A1 and 21 carry SAFETY_24V</text><path d="M920 235 H1050" class="line"/><rect x="1050" y="160" width="430" height="150" rx="16" class="box"/><text x="1075" y="205" class="head">SR1 return and restart chain</text><text x="1075" y="245">S12 / S22 then monitored RESET</text><text x="1075" y="280">Later SRA1 ARM + K1/K2 EDM</text><path d="M690 160 C700 95 875 95 885 160" class="red"/><text x="660" y="82" class="warn">A1/21-to-14 injection path: OPEN BLOCKER</text><rect x="60" y="380" width="1420" height="240" rx="16" class="box"/><text x="90" y="430" class="head">What is proved from repository source</text><text x="90" y="475">• DF-01 has zero safety credit and shares controller, power, PCB and enclosure dependencies.</text><text x="90" y="515">• Nominal heartbeat dropout opens one ordinary contact in each SR1 input return.</text><text x="90" y="555">• Nominal recovery still requires physical RESET, later physical ARM and a fresh trajectory.</text><text x="90" y="595">• PCB-P0.5 does not route the S0-to-KWD contact conductors, but panel routing is not released.</text><rect x="60" y="660" width="1420" height="230" rx="16" class="block"/><text x="90" y="710" class="head">What remains unproved</text><text x="90" y="755">• Internal KWD or panel bridges from SAFETY_24V to SR1 return nodes.</text><text x="90" y="795">• PLr/category, relay contribution, protected routing, CCF measures and accepted fault exclusions.</text><text x="90" y="835">• Brownout, contamination, debug back-power, physical fault injection and guard containment.</text><text x="90" y="875" class="warn">No physical injection is authorized until the fixture, method, limits and qualified reviewers are accepted.</text></svg>