<text x="940" y="265" class="note">1. MATERIAL: 6061-T651 aluminum plate, ASTM B209, certified.</text><text x="940" y="300" class="note">   MACHINE FROM ≥25.4 mm STOCK; MATERIAL CERTIFICATE REQUIRED.</text><text x="940" y="345" class="note">2. FINISH: AS-MACHINED, NO ANODIZE OR CONVERSION COATING.</text><text x="940" y="390" class="note">3. DATUM A: BOTTOM PT-CONTACT FACE. FLATNESS 0.05.</text><text x="940" y="425" class="note">   TOP FACE PARALLELISM 0.05 TO A; BOTH FACES Ra 3.2 µm MAX.</text><text x="940" y="470" class="note">4. DATUM B: X-MIN LONG SIDE. DATUM C: Y-MIN SHORT SIDE.</text><text x="940" y="515" class="note">5. 2X TAPPED-HOLE POSITION Ø0.10 | A | B | C.</text><text x="940" y="560" class="note">6. BREAK ALL EDGES 0.2-0.5; REMOVE BURRS; NO SHARP EDGES.</text><text x="940" y="605" class="note">7. DO NOT SUBSTITUTE ALLOY/TEMPER OR WELD/HEAT-TREAT.</text><text x="940" y="650" class="note">8. CLEAN AND DRY. IDENTIFY PART/REV WITH NON-DAMAGING TAG.</text><text x="940" y="695" class="note">9. MODEL THREADS ARE COSMETIC/ABSENT; DRAWING CALLOUT CONTROLS.</text><text x="940" y="740" class="note">10. ALL DIMENSIONS REQUIRE FAI; SEE INSPECTION REGISTER.</text><text x="940" y="785" class="note">11. UNSPECIFIED LINEAR DIMENSIONS ±0.10; ANGLES ±0.5°.</text><text x="940" y="830" class="note">12. NO CAPACITY CREDIT UNTIL QUALIFIED REVIEW AND PROOF.</text>
<rect x="900" y="930" width="835" height="250" rx="12" class="red"/><text x="940" y="975" class="h2">RELEASE BOUNDARY</text><text x="940" y="1020" class="warn">DO NOT QUOTE, MACHINE, ASSEMBLE OR POWER FROM THIS CANDIDATE.</text><text x="940" y="1060" class="note">Magtrol 4866/PT application acceptance, exact hardware, DFM,</text><text x="940" y="1095" class="note">independent calculation review, FAI, proof, alignment and the</text><text x="940" y="1130" class="note">complete guarded load rig remain blocking evidence.</text><text x="940" y="1165" class="note">PART: FX104-C01 · REV: P0.1 · IDENTIFIER: HR-V0-FX104-C01-FAB-P0.1</text></svg>