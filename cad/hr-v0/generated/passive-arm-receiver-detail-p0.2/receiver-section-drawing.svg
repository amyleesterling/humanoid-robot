<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:Arial,sans-serif;fill:#102a43;font-size:16px}.t{font-size:30px;font-weight:700}.w{font-size:14px;font-weight:700;fill:#8b2d1b}.p{fill:#dff3ff;stroke:#082b55;stroke-width:3}.d{stroke:#075b9b;stroke-width:2;fill:none}.x{stroke:#a83220;stroke-width:2;stroke-dasharray:7 5}.g{fill:#f4b942;stroke:#8a5b00;stroke-width:2}</style><rect width="1200" height="760" fill="#fff"/><text x="45" y="50" class="t">Receiver vertical stack and backup-stop allocation</text><text x="45" y="82" class="w">PRELIMINARY - NOT APPROVED FOR FABRICATION, MOTION OR ENERGIZATION - NOMINAL GEOMETRY ONLY</text><rect x="210" y="145" width="650" height="90" class="g"/><rect x="210" y="235" width="650" height="60" class="p"/><rect x="295" y="390" width="60" height="120" class="p"/><rect x="715" y="390" width="60" height="120" class="p"/><rect x="390" y="360" width="42" height="150" class="g"/><rect x="640" y="360" width="42" height="150" class="g"/><line x1="185" y1="145" x2="185" y2="295" class="d"/><text x="55" y="225">pad 9.525 + plate 6.35</text><line x1="890" y1="295" x2="890" y2="390" class="x"/><text x="915" y="340">backup gap 9.625 mm</text><line x1="890" y1="310" x2="890" y2="390" class="d"/><text x="915" y="385">shock stroke 8.128 mm</text><text x="210" y="560">Receiver top Z = 320.000; platen bottom Z = 304.125; backup stop top Z = 294.500</text><text x="210" y="595">Nominal residual after full shock stroke = 1.497 mm. Tolerance stack is not closed.</text><text x="210" y="630" class="w">ACE integrated stop remains primary; four independent catch allocations require exact hardware, load proof and qualified review.</text></svg>