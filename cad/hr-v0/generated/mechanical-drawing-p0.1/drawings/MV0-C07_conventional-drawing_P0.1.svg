267.4"/><text x="60.0" y="374.9" class="dimtxt" text-anchor="middle" transform="rotate(-90 60.0 374.9)">42.000000 OVERALL</text><text x="820.0" y="170.0" class="section" text-anchor="start">FEATURE COORDINATES (mm)</text><text x="820.0" y="202.0" class="tablehead" text-anchor="start">ID</text><text x="900.0" y="202.0" class="tablehead" text-anchor="start">X</text><text x="980.0" y="202.0" class="tablehead" text-anchor="start">Z</text><text x="1060.0" y="202.0" class="tablehead" text-anchor="start">FEATURE</text><text x="820.0" y="234.0" class="tabletxt" text-anchor="start">J1</text><text x="900.0" y="234.0" class="tabletxt" text-anchor="start">-16.00</text><text x="980.0" y="234.0" class="tabletxt" text-anchor="start">-8.00</text><text x="1060.0" y="234.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="264.0" class="tabletxt" text-anchor="start">J2</text><text x="900.0" y="264.0" class="tabletxt" text-anchor="start">-16.00</text><text x="980.0" y="264.0" class="tabletxt" text-anchor="start">+8.00</text><text x="1060.0" y="264.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="294.0" class="tabletxt" text-anchor="start">J3</text><text x="900.0" y="294.0" class="tabletxt" text-anchor="start">+16.00</text><text x="980.0" y="294.0" class="tabletxt" text-anchor="start">-8.00</text><text x="1060.0" y="294.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="324.0" class="tabletxt" text-anchor="start">J4</text><text x="900.0" y="324.0" class="tabletxt" text-anchor="start">+16.00</text><text x="980.0" y="324.0" class="tabletxt" text-anchor="start">+8.00</text><text x="1060.0" y="324.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="354.0" class="tabletxt" text-anchor="start">E1</text><text x="900.0" y="354.0" class="tabletxt" text-anchor="start">+0.00</text><text x="980.0" y="354.0" class="tabletxt" text-anchor="start">-10.00</text><text x="1060.0" y="354.0" class="tabletxt" text-anchor="start">Ø5.50 / CSK Ø11.30 x 90°</text><text x="820.0" y="384.0" class="tabletxt" text-anchor="start">E2</text><text x="900.0" y="384.0" class="tabletxt" text-anchor="start">+0.00</text><text x="980.0" y="384.0" class="tabletxt" text-anchor="start">+10.00</text><text x="1060.0" y="384.0" class="tabletxt" text-anchor="start">Ø5.50 / CSK Ø11.30 x 90°</text><text x="820.0" y="410.0" class="section" text-anchor="start">SIDE / THICKNESS CONTROL</text><rect class="profile" x="860" y="450" width="114.3" height="150"/><text x="917.1" y="630.0" class="dimtxt" text-anchor="middle">9.525 NOMINAL; 9.00 MIN / 10.00 MAX</text><rect class="recess" x="860" y="450" width="12" height="150"/><text x="1009.3" y="525.0" class="tabletxt" text-anchor="start">RAIL FACE RECESS 1.000 ±0.05</text><text x="40.0" y="690.0" class="section" text-anchor="start">GENERAL AND PART-SPECIFIC CONTROLS</text><text x="40.0" y="722.0" class="note" text-anchor="start">1. UNITS mm. DO NOT SCALE. PROFILE IS CONTROLLED BY THIS DRAWING, HASH-BOUND FINISHED DXF AND STEP TOGETHER.</text><text x="40.0" y="749.0" class="note" text-anchor="start">2. PROFILE: profile +/-0.05 mm; R2.00 all finished profile corners.</text><text x="40.0" y="776.0" class="note" text-anchor="start">3. MATERIAL CANDIDATE: ASTM B209 6061-T651, certified heat/lot; project minimum yield screen 240 MPa.</text><text x="40.0" y="803.0" class="note" text-anchor="start">4. FINISH: BARE AS-MACHINED; EDGE BREAK 0.20..0.50; BURR-FREE; NO COATING.</text><text x="40.0" y="830.0" class="note" text-anchor="start">5. BROAD-FACE FLATNESS &lt;=0.15; OPPOSITE-FACE PARALLELISM &lt;=0.10.</text><text x="40.0" y="857.0" class="note" text-anchor="start">6. J1-J4: Ø2.70 +0.10/-0.00 at X=±16.00, Z=±8.00; coordinates ±0.05.</text><text x="40.0" y="884.0" class="note" text-anchor="start">7. Two moving-side rail faces recessed 1.000 ±0.05; rails coplanar &lt;=0.03; rail centerlines X=±38.</text><text x="40.0" y="911.0" class="note" text-anchor="start">8. COUNTERSINK RESIDUAL &gt;=5.80; RECEIVED M5 HEAD PROUD &lt;=0.05 / RECESS &lt;=0.25; FUNCTIONAL-GAUGE RESULT REQUIRED.</text><text x="40.0" y="938.0" class="note" text-anchor="start">9. INSPECTION FRAME ICF-01: PRIMARY A = +Y BROAD FACE (NON-COUNTERSINK FACE WHERE PRESENT); REGISTER X/Z BY 2D RIGID LEAST-SQUARES FIT OF THE</text><text x="55.0" y="961.0" class="note" text-anchor="start">FOUR SMALL INTERFACE-HOLE CENTERS TO THEIR NOMINAL PATTERN; NO SCALE; REPORT EACH RESIDUAL.</text><text x="40.0" y="988.0" class="note" text-anchor="start">10. ICF-01 IS A CANDIDATE CMM METHOD, NOT A RELEASED ASME Y14.5 DATUM REFERENCE FRAME. QUALIFIED DISPOSITION REQUIRED.</text><text x="40.0" y="1015.0" class="note" text-anchor="start">11. RECEIVED MATING-PART DRY FIT, FASTENER SEATING, MTR, FAI AND QUALIFIED REVIEW REQUIRED. NO FILING, SLOTTING, BENDING OR FORCED ALIGNMENT.</text><text x="40.0" y="1057.0" class="section" text-anchor="start">SOURCE CONTROL BINDING</text><text x="40.0" y="1089.0" class="tablehead" text-anchor="start">CONTROL</text><text x="155.0" y="1089.0" class="tablehead" text-anchor="start">FEATURE</text><text x="475.0" y="1089.0" class="tablehead" text-anchor="start">NOMINAL</text><text x="925.0" y="1089.0" class="tablehead" text-anchor="start">TOLERANCE / LIMIT</text><text x="1250.0" y="1089.0" class="tablehead" text-anchor="start">INSPECTION</text><rect class="row" x="30" y="1097" width="1535" height="54"/><text x="40.0" y="1117.0" class="tabletxt" text-anchor="start">STOP-003</text><text x="155.0" y="1117.0" class="tabletxt" text-anchor="start">finished profile and catch rails</text><text x="475.0" y="1117.0" class="tabletxt" text-anchor="start">84.000 x 42.000 x 9.525 mm envelope; rails</text><text x="475.0" y="1138.0" class="tabletxt" text-anchor="start">X=+/-38</text><text x="925.0" y="1117.0" class="tabletxt" text-anchor="start">profile +/-0.05; thickness</text><text x="925.0" y="1138.0" class="tabletxt" text-anchor="start">9.00..10.00</text><text x="1250.0" y="1117.0" class="tabletxt" text-anchor="start">CMM profile and thickness map</text><rect class="row" x="30" y="1151" width="1535" height="54"/><text x="40.0" y="1171.0" class="tabletxt" text-anchor="start">STOP-004</text><text x="155.0" y="1171.0" class="tabletxt" text-anchor="start">moving-side catch face step</text><text x="475.0" y="1171.0" class="tabletxt" text-anchor="start">1.000 mm recessed from parent adapter face</text><text x="925.0" y="1171.0" class="tabletxt" text-anchor="start">+/-0.05; both rails coplanar &lt;=0.03</text><text x="1250.0" y="1171.0" class="tabletxt" text-anchor="start">CMM/ height gauge; retain surface</text><text x="1250.0" y="1192.0" class="tabletxt" text-anchor="start">map</text><rect class="row" x="30" y="1205" width="1535" height="54"/><text x="40.0" y="1225.0" class="tabletxt" text-anchor="start">STOP-005</text><text x="155.0" y="1225.0" class="tabletxt" text-anchor="start">shared four M2.5 and two</text><text x="155.0" y="1246.0" class="tabletxt" text-anchor="start">countersunk M5 interfaces</text><text x="475.0" y="1225.0" class="tabletxt" text-anchor="start">same exact coordinates as MV0-C01</text><text x="925.0" y="1225.0" class="tabletxt" text-anchor="start">retain P0.6 adapter hole/countersink</text><text x="925.0" y="1246.0" class="tabletxt" text-anchor="start">controls</text><text x="1250.0" y="1225.0" class="tabletxt" text-anchor="start">pin/ CMM/ optical plus received</text><text x="1250.0" y="1246.0" class="tabletxt" text-anchor="start">frame/ member dry fit</text><rect class="row" x="30" y="1259" width="1535" height="96"/><text x="40.0" y="1279.0" class="tabletxt" text-anchor="start">STOP-006</text><text x="155.0" y="1279.0" class="tabletxt" text-anchor="start">maximum undeformed occupied</text><text x="155.0" y="1300.0" class="tabletxt" text-anchor="start">envelope</text><text x="475.0" y="1279.0" class="tabletxt" text-anchor="start">two 6 x 42 mm rail envelopes; protrusion &lt;=</text><text x="475.0" y="1300.0" class="tabletxt" text-anchor="start">0.750 mm</text><text x="925.0" y="1279.0" class="tabletxt" text-anchor="start">no contact at J2=115 deg; metal</text><text x="925.0" y="1300.0" class="tabletxt" text-anchor="start">backup remains at 118 deg nominal</text><text x="1250.0" y="1279.0" class="tabletxt" text-anchor="start">SELECTION REQUIRED; received</text><text x="1250.0" y="1300.0" class="tabletxt" text-anchor="start">thickness/ retention/</text><text x="1250.0" y="1321.0" class="tabletxt" text-anchor="start">force-stroke/ temperature/ life</text><text x="1250.0" y="1342.0" class="tabletxt" text-anchor="start">characterization</text><rect x="1010" y="1410" width="550" height="70" fill="#dff3ff" stroke="#082f5b"/><text x="1030.0" y="1440.0" class="tablehead" text-anchor="start">STATUS: NONSELECTED CANDIDATE / FAI UNEXECUTED</text><text x="1030.0" y="1467.0" class="tabletxt" text-anchor="start">DRAWING, STEP AND DXF MUST REMAIN HASH-BOUND</text></svg>