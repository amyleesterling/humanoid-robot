text x="1060.0" y="324.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="354.0" class="tabletxt" text-anchor="start">K1</text><text x="900.0" y="354.0" class="tabletxt" text-anchor="start">+0.00</text><text x="980.0" y="354.0" class="tabletxt" text-anchor="start">-30.00</text><text x="1060.0" y="354.0" class="tabletxt" text-anchor="start">Ø8.50</text><text x="820.0" y="384.0" class="tabletxt" text-anchor="start">K2</text><text x="900.0" y="384.0" class="tabletxt" text-anchor="start">+0.00</text><text x="980.0" y="384.0" class="tabletxt" text-anchor="start">+30.00</text><text x="1060.0" y="384.0" class="tabletxt" text-anchor="start">Ø8.50</text><text x="820.0" y="410.0" class="section" text-anchor="start">SIDE / THICKNESS CONTROL</text><rect class="profile" x="860" y="450" width="114.3" height="150"/><text x="917.1" y="630.0" class="dimtxt" text-anchor="middle">9.525 NOMINAL; 9.00 MIN / 10.00 MAX</text><text x="40.0" y="690.0" class="section" text-anchor="start">GENERAL AND PART-SPECIFIC CONTROLS</text><text x="40.0" y="722.0" class="note" text-anchor="start">1. UNITS mm. DO NOT SCALE. PROFILE IS CONTROLLED BY THIS DRAWING, HASH-BOUND FINISHED DXF AND STEP TOGETHER.</text><text x="40.0" y="749.0" class="note" text-anchor="start">2. PROFILE: +/-0.10 mm rectangular envelope.</text><text x="40.0" y="776.0" class="note" text-anchor="start">3. MATERIAL CANDIDATE: ASTM B209 6061-T651, certified heat/lot; project minimum yield screen 240 MPa.</text><text x="40.0" y="803.0" class="note" text-anchor="start">4. FINISH: BARE AS-MACHINED; EDGE BREAK 0.20..0.50; BURR-FREE; NO COATING.</text><text x="40.0" y="830.0" class="note" text-anchor="start">5. BROAD-FACE FLATNESS &lt;=0.15; OPPOSITE-FACE PARALLELISM &lt;=0.10.</text><text x="40.0" y="857.0" class="note" text-anchor="start">6. S1-S4: Ø2.70 +0.10/-0.00 at X=±16.00, Z=±8.00; coordinates ±0.05.</text><text x="40.0" y="884.0" class="note" text-anchor="start">7. K1-K2: Ø8.50 +0.10/-0.00 at X=0, Z=±30.00; coordinates ±0.05.</text><text x="40.0" y="911.0" class="note" text-anchor="start">8. INSPECTION FRAME ICF-01: PRIMARY A = +Y BROAD FACE (NON-COUNTERSINK FACE WHERE PRESENT); REGISTER X/Z BY 2D RIGID LEAST-SQUARES FIT OF THE</text><text x="55.0" y="934.0" class="note" text-anchor="start">FOUR SMALL INTERFACE-HOLE CENTERS TO THEIR NOMINAL PATTERN; NO SCALE; REPORT EACH RESIDUAL.</text><text x="40.0" y="961.0" class="note" text-anchor="start">9. ICF-01 IS A CANDIDATE CMM METHOD, NOT A RELEASED ASME Y14.5 DATUM REFERENCE FRAME. QUALIFIED DISPOSITION REQUIRED.</text><text x="40.0" y="988.0" class="note" text-anchor="start">10. RECEIVED MATING-PART DRY FIT, FASTENER SEATING, MTR, FAI AND QUALIFIED REVIEW REQUIRED. NO FILING, SLOTTING, BENDING OR FORCED ALIGNMENT.</text><text x="40.0" y="1030.0" class="section" text-anchor="start">SOURCE CONTROL BINDING</text><text x="40.0" y="1062.0" class="tablehead" text-anchor="start">CONTROL</text><text x="155.0" y="1062.0" class="tablehead" text-anchor="start">FEATURE</text><text x="475.0" y="1062.0" class="tablehead" text-anchor="start">NOMINAL</text><text x="925.0" y="1062.0" class="tablehead" text-anchor="start">TOLERANCE / LIMIT</text><text x="1250.0" y="1062.0" class="tablehead" text-anchor="start">INSPECTION</text><rect class="row" x="30" y="1070" width="1535" height="54"/><text x="40.0" y="1090.0" class="tabletxt" text-anchor="start">C05-001</text><text x="155.0" y="1090.0" class="tabletxt" text-anchor="start">finished envelope</text><text x="475.0" y="1090.0" class="tabletxt" text-anchor="start">48.00 x 80.00 x 9.525</text><text x="925.0" y="1090.0" class="tabletxt" text-anchor="start">width/height +/-0.10; thickness 9.00</text><text x="925.0" y="1111.0" class="tabletxt" text-anchor="start">to 10.00</text><text x="1250.0" y="1090.0" class="tabletxt" text-anchor="start">CMM/ caliper plus five-point</text><text x="1250.0" y="1111.0" class="tabletxt" text-anchor="start">micrometer map</text><rect class="row" x="30" y="1124" width="1535" height="54"/><text x="40.0" y="1144.0" class="tabletxt" text-anchor="start">C05-002</text><text x="155.0" y="1144.0" class="tabletxt" text-anchor="start">four S102 clearance holes</text><text x="475.0" y="1144.0" class="tabletxt" text-anchor="start">diameter 2.70 at X=+/-16 Z=+/-8</text><text x="925.0" y="1144.0" class="tabletxt" text-anchor="start">diameter +0.10/-0.00; coordinates</text><text x="925.0" y="1165.0" class="tabletxt" text-anchor="start">+/-0.05</text><text x="1250.0" y="1144.0" class="tabletxt" text-anchor="start">pin gauges plus CMM; dry fit</text><text x="1250.0" y="1165.0" class="tabletxt" text-anchor="start">received S102</text><rect class="row" x="30" y="1178" width="1535" height="54"/><text x="40.0" y="1198.0" class="tabletxt" text-anchor="start">C05-003</text><text x="155.0" y="1198.0" class="tabletxt" text-anchor="start">two column-slot clearance holes</text><text x="475.0" y="1198.0" class="tabletxt" text-anchor="start">diameter 8.50 at X=0 Z=+/-30</text><text x="925.0" y="1198.0" class="tabletxt" text-anchor="start">diameter +0.10/-0.00; coordinates</text><text x="925.0" y="1219.0" class="tabletxt" text-anchor="start">+/-0.05</text><text x="1250.0" y="1198.0" class="tabletxt" text-anchor="start">pin gauges plus CMM; dry fit</text><text x="1250.0" y="1219.0" class="tabletxt" text-anchor="start">received 17-8520/ 13035/ 40-4040</text><rect class="row" x="30" y="1232" width="1535" height="54"/><text x="40.0" y="1252.0" class="tabletxt" text-anchor="start">C05-004</text><text x="155.0" y="1252.0" class="tabletxt" text-anchor="start">broad faces and finish</text><text x="475.0" y="1252.0" class="tabletxt" text-anchor="start">bare as-machined</text><text x="925.0" y="1252.0" class="tabletxt" text-anchor="start">flatness &lt;=0.15; parallelism &lt;=0.10;</text><text x="925.0" y="1273.0" class="tabletxt" text-anchor="start">edge break 0.20 to 0.50; burr-free</text><text x="1250.0" y="1252.0" class="tabletxt" text-anchor="start">surface plate/ CMM and visual</text><rect class="row" x="30" y="1286" width="1535" height="75"/><text x="40.0" y="1306.0" class="tabletxt" text-anchor="start">C05-005</text><text x="155.0" y="1306.0" class="tabletxt" text-anchor="start">column/S102 dry-fit alignment</text><text x="475.0" y="1306.0" class="tabletxt" text-anchor="start">plate seats on column face and rolled S102</text><text x="475.0" y="1327.0" class="tabletxt" text-anchor="start">face without forced alignment</text><text x="925.0" y="1306.0" class="tabletxt" text-anchor="start">no filing, slotting, bending or</text><text x="925.0" y="1327.0" class="tabletxt" text-anchor="start">substitution</text><text x="1250.0" y="1306.0" class="tabletxt" text-anchor="start">documented dry fit with fasteners</text><text x="1250.0" y="1327.0" class="tabletxt" text-anchor="start">loose; preserve photos and</text><text x="1250.0" y="1348.0" class="tabletxt" text-anchor="start">deviations</text><rect x="1010" y="1416" width="550" height="70" fill="#dff3ff" stroke="#082f5b"/><text x="1030.0" y="1446.0" class="tablehead" text-anchor="start">STATUS: NONSELECTED CANDIDATE / FAI UNEXECUTED</text><text x="1030.0" y="1473.0" class="tabletxt" text-anchor="start">DRAWING, STEP AND DXF MUST REMAIN HASH-BOUND</text></svg>