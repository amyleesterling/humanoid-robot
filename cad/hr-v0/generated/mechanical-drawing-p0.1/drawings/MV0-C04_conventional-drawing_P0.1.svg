url(#arr)" marker-end="url(#arr)"/><line class="ext" x1="218.0" y1="490.0" x2="218.0" y2="557.0"/><line class="ext" x1="482.0" y1="490.0" x2="482.0" y2="557.0"/><text x="350.0" y="537.0" class="dimtxt" text-anchor="middle">48.000000 OVERALL</text><line class="dim" x1="153.0" y1="490.0" x2="153.0" y2="270.0" marker-start="url(#arr)" marker-end="url(#arr)"/><line class="ext" x1="141.0" y1="490.0" x2="218.0" y2="490.0"/><line class="ext" x1="141.0" y1="270.0" x2="218.0" y2="270.0"/><text x="143.0" y="380.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 143.0 380.0)">40.000000 OVERALL</text><text x="820.0" y="170.0" class="section" text-anchor="start">FEATURE COORDINATES (mm)</text><text x="820.0" y="202.0" class="tablehead" text-anchor="start">ID</text><text x="900.0" y="202.0" class="tablehead" text-anchor="start">X</text><text x="980.0" y="202.0" class="tablehead" text-anchor="start">Z</text><text x="1060.0" y="202.0" class="tablehead" text-anchor="start">FEATURE</text><text x="820.0" y="234.0" class="tabletxt" text-anchor="start">H1</text><text x="900.0" y="234.0" class="tabletxt" text-anchor="start">-11.00</text><text x="980.0" y="234.0" class="tabletxt" text-anchor="start">+8.00</text><text x="1060.0" y="234.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="264.0" class="tabletxt" text-anchor="start">H2</text><text x="900.0" y="264.0" class="tabletxt" text-anchor="start">+11.00</text><text x="980.0" y="264.0" class="tabletxt" text-anchor="start">+8.00</text><text x="1060.0" y="264.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="294.0" class="tabletxt" text-anchor="start">H3</text><text x="900.0" y="294.0" class="tabletxt" text-anchor="start">-12.00</text><text x="980.0" y="294.0" class="tabletxt" text-anchor="start">-6.00</text><text x="1060.0" y="294.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="324.0" class="tabletxt" text-anchor="start">H4</text><text x="900.0" y="324.0" class="tabletxt" text-anchor="start">+12.00</text><text x="980.0" y="324.0" class="tabletxt" text-anchor="start">-6.00</text><text x="1060.0" y="324.0" class="tabletxt" text-anchor="start">Ø2.70</text><text x="820.0" y="354.0" class="tabletxt" text-anchor="start">E1</text><text x="900.0" y="354.0" class="tabletxt" text-anchor="start">+0.00</text><text x="980.0" y="354.0" class="tabletxt" text-anchor="start">-10.00</text><text x="1060.0" y="354.0" class="tabletxt" text-anchor="start">Ø5.50 / CSK Ø11.30 x 90°</text><text x="820.0" y="384.0" class="tabletxt" text-anchor="start">E2</text><text x="900.0" y="384.0" class="tabletxt" text-anchor="start">+0.00</text><text x="980.0" y="384.0" class="tabletxt" text-anchor="start">+10.00</text><text x="1060.0" y="384.0" class="tabletxt" text-anchor="start">Ø5.50 / CSK Ø11.30 x 90°</text><text x="820.0" y="410.0" class="section" text-anchor="start">SIDE / THICKNESS CONTROL</text><rect class="profile" x="860" y="450" width="114.3" height="150"/><text x="917.1" y="630.0" class="dimtxt" text-anchor="middle">9.525 NOMINAL; 9.00 MIN / 10.00 MAX</text><text x="1009.3" y="525.0" class="tabletxt" text-anchor="start">COUNTERSINK SIDE: -Y FACE</text><text x="40.0" y="690.0" class="section" text-anchor="start">GENERAL AND PART-SPECIFIC CONTROLS</text><text x="40.0" y="722.0" class="note" text-anchor="start">1. UNITS mm. DO NOT SCALE. PROFILE IS CONTROLLED BY THIS DRAWING, HASH-BOUND FINISHED DXF AND STEP TOGETHER.</text><text x="40.0" y="749.0" class="note" text-anchor="start">2. PROFILE: +/-0.10 mm rectangular envelope.</text><text x="40.0" y="776.0" class="note" text-anchor="start">3. MATERIAL CANDIDATE: ASTM B209 6061-T651, certified heat/lot; project minimum yield screen 240 MPa.</text><text x="40.0" y="803.0" class="note" text-anchor="start">4. FINISH: BARE AS-MACHINED; EDGE BREAK 0.20..0.50; BURR-FREE; NO COATING.</text><text x="40.0" y="830.0" class="note" text-anchor="start">5. BROAD-FACE FLATNESS &lt;=0.15; OPPOSITE-FACE PARALLELISM &lt;=0.10.</text><text x="40.0" y="857.0" class="note" text-anchor="start">6. H1-H4: Ø2.70 +0.10/-0.00 at (-11,+8),(+11,+8),(-12,-6),(+12,-6); coordinates ±0.05.</text><text x="40.0" y="884.0" class="note" text-anchor="start">7. E1-E2: Ø5.50 +0.10/-0.00 at X=0, Z=±10.00; CSK Ø11.30 +0.10/-0.00 x 90°.</text><text x="40.0" y="911.0" class="note" text-anchor="start">8. COUNTERSINK RESIDUAL &gt;=5.80; RECEIVED M5 HEAD PROUD &lt;=0.05 / RECESS &lt;=0.25; FUNCTIONAL-GAUGE RESULT REQUIRED.</text><text x="40.0" y="938.0" class="note" text-anchor="start">9. INSPECTION FRAME ICF-01: PRIMARY A = +Y BROAD FACE (NON-COUNTERSINK FACE WHERE PRESENT); REGISTER X/Z BY 2D RIGID LEAST-SQUARES FIT OF THE</text><text x="55.0" y="961.0" class="note" text-anchor="start">FOUR SMALL INTERFACE-HOLE CENTERS TO THEIR NOMINAL PATTERN; NO SCALE; REPORT EACH RESIDUAL.</text><text x="40.0" y="988.0" class="note" text-anchor="start">10. ICF-01 IS A CANDIDATE CMM METHOD, NOT A RELEASED ASME Y14.5 DATUM REFERENCE FRAME. QUALIFIED DISPOSITION REQUIRED.</text><text x="40.0" y="1015.0" class="note" text-anchor="start">11. RECEIVED MATING-PART DRY FIT, FASTENER SEATING, MTR, FAI AND QUALIFIED REVIEW REQUIRED. NO FILING, SLOTTING, BENDING OR FORCED ALIGNMENT.</text><text x="40.0" y="1057.0" class="section" text-anchor="start">SOURCE CONTROL BINDING</text><text x="40.0" y="1089.0" class="tablehead" text-anchor="start">CONTROL</text><text x="155.0" y="1089.0" class="tablehead" text-anchor="start">FEATURE</text><text x="475.0" y="1089.0" class="tablehead" text-anchor="start">NOMINAL</text><text x="925.0" y="1089.0" class="tablehead" text-anchor="start">TOLERANCE / LIMIT</text><text x="1250.0" y="1089.0" class="tablehead" text-anchor="start">INSPECTION</text><rect class="row" x="30" y="1097" width="1535" height="54"/><text x="40.0" y="1117.0" class="tabletxt" text-anchor="start">C04-001</text><text x="155.0" y="1117.0" class="tabletxt" text-anchor="start">finished envelope</text><text x="475.0" y="1117.0" class="tabletxt" text-anchor="start">48.00 x 40.00 x 9.525</text><text x="925.0" y="1117.0" class="tabletxt" text-anchor="start">width/height +/-0.10; thickness 9.00</text><text x="925.0" y="1138.0" class="tabletxt" text-anchor="start">to 10.00</text><text x="1250.0" y="1117.0" class="tabletxt" text-anchor="start">CMM/ caliper plus five-point</text><text x="1250.0" y="1138.0" class="tabletxt" text-anchor="start">micrometer map</text><rect class="row" x="30" y="1151" width="1535" height="54"/><text x="40.0" y="1171.0" class="tabletxt" text-anchor="start">C04-002</text><text x="155.0" y="1171.0" class="tabletxt" text-anchor="start">four H104 clearance holes</text><text x="475.0" y="1171.0" class="tabletxt" text-anchor="start">diameter 2.70 at X/Z</text><text x="475.0" y="1192.0" class="tabletxt" text-anchor="start">(-11,+8),(+11,+8),(-12,-6),(+12,-6)</text><text x="925.0" y="1171.0" class="tabletxt" text-anchor="start">diameter +0.10/-0.00; coordinates</text><text x="925.0" y="1192.0" class="tabletxt" text-anchor="start">+/-0.05</text><text x="1250.0" y="1171.0" class="tabletxt" text-anchor="start">pin gauges plus CMM; dry fit</text><text x="1250.0" y="1192.0" class="tabletxt" text-anchor="start">received H104</text><rect class="row" x="30" y="1205" width="1535" height="54"/><text x="40.0" y="1225.0" class="tabletxt" text-anchor="start">C04-003</text><text x="155.0" y="1225.0" class="tabletxt" text-anchor="start">two M5 clearance/countersink holes</text><text x="475.0" y="1225.0" class="tabletxt" text-anchor="start">diameter 5.50 and countersink 11.30 at X=0</text><text x="475.0" y="1246.0" class="tabletxt" text-anchor="start">Z=+/-10</text><text x="925.0" y="1225.0" class="tabletxt" text-anchor="start">hole +0.10/-0.00; countersink</text><text x="925.0" y="1246.0" class="tabletxt" text-anchor="start">+0.10/-0.00; 90 deg nominal</text><text x="1250.0" y="1225.0" class="tabletxt" text-anchor="start">pin/ CMM/ optical plus received M5</text><text x="1250.0" y="1246.0" class="tabletxt" text-anchor="start">functional gauge</text><rect class="row" x="30" y="1259" width="1535" height="54"/><text x="40.0" y="1279.0" class="tabletxt" text-anchor="start">C04-004</text><text x="155.0" y="1279.0" class="tabletxt" text-anchor="start">broad faces and finish</text><text x="475.0" y="1279.0" class="tabletxt" text-anchor="start">bare as-machined</text><text x="925.0" y="1279.0" class="tabletxt" text-anchor="start">flatness &lt;=0.15; parallelism &lt;=0.10;</text><text x="925.0" y="1300.0" class="tabletxt" text-anchor="start">edge break 0.20 to 0.50; burr-free</text><text x="1250.0" y="1279.0" class="tabletxt" text-anchor="start">surface plate/ CMM and visual</text><rect class="row" x="30" y="1313" width="1535" height="75"/><text x="40.0" y="1333.0" class="tabletxt" text-anchor="start">C04-005</text><text x="155.0" y="1333.0" class="tabletxt" text-anchor="start">received H104 registration</text><text x="475.0" y="1333.0" class="tabletxt" text-anchor="start">all four selected axes accept received frame</text><text x="475.0" y="1354.0" class="tabletxt" text-anchor="start">without forced alignment</text><text x="925.0" y="1333.0" class="tabletxt" text-anchor="start">no filing, slotting, bending or</text><text x="925.0" y="1354.0" class="tabletxt" text-anchor="start">substitution</text><text x="1250.0" y="1333.0" class="tabletxt" text-anchor="start">documented dry fit with fasteners</text><text x="1250.0" y="1354.0" class="tabletxt" text-anchor="start">loose; preserve photos and</text><text x="1250.0" y="1375.0" class="tabletxt" text-anchor="start">deviations</text><rect x="1010" y="1443" width="550" height="70" fill="#dff3ff" stroke="#082f5b"/><text x="1030.0" y="1473.0" class="tablehead" text-anchor="start">STATUS: NONSELECTED CANDIDATE / FAI UNEXECUTED</text><text x="1030.0" y="1500.0" class="tabletxt" text-anchor="start">DRAWING, STEP AND DXF MUST REMAIN HASH-BOUND</text></svg>