<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">HR-V0 P1.21 no-load fixture planning layout</title><desc id="d">A 560 by 320 millimetre candidate control-only fixture with source isolation, safety relays, watchdog relays, stimuli and isolated measurement zones. Actuator power is physically absent.</desc><style>text{font-family:system-ui,sans-serif;fill:#072b52}.h{font-size:32px;font-weight:850}.w{font-size:20px;font-weight:850}.b{font-size:21px}.s{font-size:16px}.z{fill:#e6f6ff;stroke:#12699b;stroke-width:4}.hold{fill:#fff1b8;stroke:#946200;stroke-width:4}.ban{fill:#ffe3e3;stroke:#a11;stroke-width:4}.rail{stroke:#687888;stroke-width:10}</style><rect width="1200" height="760" fill="#f8fcff"/><text x="40" y="29" class="w">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, ASSEMBLY, CONNECTION</text><text x="40" y="58" class="w">NOT APPROVED FOR POWERED TESTING, MOTION, OR ENERGIZATION</text><rect x="50" y="90" width="1100" height="610" rx="24" fill="white" stroke="#072b52" stroke-width="6"/><text x="80" y="135" class="h">560 x 320 mm planning envelope - received-fit check required</text><line x1="90" y1="280" x2="1110" y2="280" class="rail"/><rect x="90" y="165" width="210" height="90" rx="12" class="hold"/><text x="108" y="200" class="b">A - source isolation</text><text x="108" y="232" class="s">PSFIX / EDISC / F24</text><rect x="330" y="165" width="285" height="90" rx="12" class="z"/><text x="350" y="200" class="b">B - eligibility relays</text><text x="350" y="232" class="s">SR1 / SRA1</text><rect x="650" y="165" width="260" height="90" rx="12" class="z"/><text x="670" y="200" class="b">C - watchdog gate</text><text x="670" y="232" class="s">KWD1 / KWD2</text><rect x="90" y="345" width="430" height="180" rx="16" class="hold"/><text x="115" y="390" class="b">D - controlled stimuli</text><text x="115" y="430" class="s">S0 / S1 / S2 / EDMSIM / heartbeat</text><text x="115" y="470" class="s">All switch states independently timestamped</text><rect x="555" y="345" width="555" height="180" rx="16" class="z"/><text x="580" y="390" class="b">E - isolated measurement boundary</text><text x="580" y="430" class="s">15 required signals / one common time base</text><text x="580" y="470" class="s">Contact outputs use low-energy continuity only</text><rect x="90" y="565" width="1020" height="95" rx="16" class="ban"/><text x="115" y="603" class="b">PHYSICALLY ABSENT</text><text x="115" y="637" class="s">Actuator source / actuator rail / K1/K2 contactors / actuators / motion or AI path / mains</text></svg>