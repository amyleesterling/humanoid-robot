<svg xmlns='http://www.w3.org/2000/svg' width='279.4mm' height='215.9mm' viewBox='0 0 279.4 215.9' role='img' aria-labelledby='title desc'><title id='title'>Disposable carrier-fit mockups</title><desc id='desc'>US Letter landscape sheet containing three 100 by 60 millimetre inert carrier envelopes and two 100 millimetre calibration bars.</desc><style>text{font-family:Arial,sans-serif;fill:#092f57}.title{font-size:6px;font-weight:700}.warn{font-size:4.3px;font-weight:700;fill:#75151d}.label{font-size:6px;font-weight:700}.small{font-size:3.8px}.tiny{font-size:3.2px}.board{fill:#dff3ff;stroke:#092f57;stroke-width:.6}circle,line{fill:white;stroke:#092f57;stroke-width:.45}</style><rect width='279.4' height='215.9' fill='white'/><text x='12' y='12' class='title'>R265 DISPOSABLE INERT FIT MOCKUPS - PRINT AT 100%</text><text x='12' y='20' class='warn'>NOT A DRILL TEMPLATE. DO NOT TRANSFER CENTERS TO METAL. VERIFY BOTH SCALE BARS.</text><g><rect x='12' y='30' width='100' height='60' class='board'/><circle cx='17' cy='35' r='1.6'/><circle cx='107' cy='35' r='1.6'/><circle cx='17' cy='85' r='1.6'/><circle cx='107' cy='85' r='1.6'/><line x1='20' y1='57' x2='20' y2='63'/><line x1='17' y1='60' x2='23' y2='60'/><line x1='104' y1='57' x2='104' y2='63'/><line x1='101' y1='60' x2='107' y2='60'/><text x='62' y='57' text-anchor='middle' class='label'>LIM1</text><text x='62' y='73' text-anchor='middle' class='small'>100 x 60 mm envelope</text><text x='20' y='54' class='tiny'>JIN1</text><text x='88' y='54' class='tiny'>JOUT1</text></g><g><rect x='124' y='30' width='100' height='60' class='board'/><circle cx='129' cy='35' r='1.6'/><circle cx='219' cy='35' r='1.6'/><circle cx='129' cy='85' r='1.6'/><circle cx='219' cy='85' r='1.6'/><line x1='132' y1='57' x2='132' y2='63'/><line x1='129' y1='60' x2='135' y2='60'/><line x1='216' y1='57' x2='216' y2='63'/><line x1='213' y1='60' x2='219' y2='60'/><text x='174' y='57' text-anchor='middle' class='label'>LIM2</text><text x='174' y='73' text-anchor='middle' class='small'>100 x 60 mm envelope</text><text x='132' y='54' class='tiny'>JIN1</text><text x='200' y='54' class='tiny'>JOUT1</text></g><g><rect x='12' y='102' width='100' height='60' class='board'/><circle cx='17' cy='107' r='1.6'/><circle cx='107' cy='107' r='1.6'/><circle cx='17' cy='157' r='1.6'/><circle cx='107' cy='157' r='1.6'/><line x1='20' y1='129' x2='20' y2='135'/><line x1='17' y1='132' x2='23' y2='132'/><line x1='104' y1='129' x2='104' y2='135'/><line x1='101' y1='132' x2='107' y2='132'/><text x='62' y='129' text-anchor='middle' class='label'>LIM3</text><text x='62' y='145' text-anchor='middle' class='small'>100 x 60 mm envelope</text><text x='20' y='126' class='tiny'>JIN1</text><text x='88' y='126' class='tiny'>JOUT1</text></g><g><line x1='124' y1='115' x2='224' y2='115'/><line x1='124' y1='111' x2='124' y2='119'/><line x1='224' y1='111' x2='224' y2='119'/><text x='174' y='109' text-anchor='middle' class='label'>100 mm horizontal</text><line x1='250' y1='102' x2='250' y2='202'/><line x1='246' y1='102' x2='254' y2='102'/><line x1='246' y1='202' x2='254' y2='202'/><text x='242' y='152' text-anchor='middle' class='label' transform='rotate(-90 242 152)'>100 mm vertical</text></g><text x='124' y='140' class='warn'>CUT PAPER/CARD ONLY AFTER</text><text x='124' y='147' class='warn'>TWO-AXIS SCALE ACCEPTANCE.</text><text x='124' y='160' class='small'>Crosshairs: connector anchors only.</text><text x='124' y='167' class='small'>Circles: source-board hole envelopes.</text><text x='124' y='174' class='small'>All tolerances and physical acceptance remain open.</text><text x='12' y='194' class='warn'>PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, MARKING, DRILLING,</text><text x='12' y='202' class='warn'>ASSEMBLY, CONNECTION, POWERED TESTING, MOTION, OR ENERGIZATION</text></svg>