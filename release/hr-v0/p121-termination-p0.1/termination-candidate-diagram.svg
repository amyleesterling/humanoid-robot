<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc"><title id="title">P1.21 endpoint termination candidates</title><desc id="desc">Five XD24 and seven KWD endpoints use an eight millimeter ferrule candidate. Two Pilz endpoints use a seven millimeter ferrule candidate. All are held.</desc><style>text{font-family:Arial,sans-serif;fill:#082b4c;font-size:16px}.small{font-size:14px}.title{font-size:22px;font-weight:700}.box{fill:#fff;stroke:#1268a8;stroke-width:3}.gold{fill:#fff0b3;stroke:#9b6d00;stroke-width:3}.line{stroke:#1268a8;stroke-width:5}.wire{stroke:#1c87c9;stroke-width:10}.ferr{fill:#d9e1e6;stroke:#082b4c;stroke-width:2}.collar{fill:#111}.hold{fill:#fff7d8;stroke:#9b6d00;stroke-width:3;stroke-dasharray:8 5}</style><rect width="1180" height="720" fill="#f7fbfe"/><text x="34" y="42" class="title">HR-V0-P121-TERM-P0.1 · candidate process, not a wiring release</text><rect x="50" y="78" width="1080" height="550" rx="12" class="box"/><text x="80" y="120" class="title">Belden 3057 BL005 · 16 AWG</text><path d="M90 170 H310" class="wire"/><rect x="295" y="153" width="105" height="34" class="collar"/><rect x="385" y="158" width="105" height="24" class="ferr"/><text x="80" y="225">Strip 11 mm · item 3200043 · 8 mm contact sleeve</text><path d="M490 170 H600" class="line"/><rect x="600" y="125" width="220" height="90" rx="8" class="gold"/><text x="625" y="160" class="title">12 endpoints</text><text x="625" y="190">5 × XD24 + 7 × KWD</text><path d="M90 325 H310" class="wire"/><rect x="295" y="313" width="195" height="24" class="ferr"/><text x="80" y="380">Strip 7 mm · item 3200263 · 7 mm uninsulated sleeve</text><path d="M490 325 H600" class="line"/><rect x="600" y="280" width="220" height="90" rx="8" class="gold"/><text x="625" y="315" class="title">2 endpoints</text><text x="625" y="345">SR1:A1 + SRA1:A1</text><rect x="860" y="120" width="230" height="250" rx="10" class="hold"/><text x="885" y="155" class="title">Qualification chain</text><text x="885" y="195">WIREFOX 10</text><text x="885" y="225">CRIMPFOX 6 station 2</text><text x="885" y="255">40 N for 60 seconds</text><text x="885" y="285">calibrated torque tool</text><text x="885" y="315">received terminal fit</text><text x="885" y="345">qualified acceptance</text><rect x="80" y="465" width="1010" height="120" rx="10" class="hold"/><text x="105" y="505" class="title">Still open</text><text x="105" y="540">Exact bits · calibration · received coupons · installed retention · color/markers · P1.21 acceptance · work authorization</text><text x="105" y="575">No safety credit is assigned to an ordinary ferrule, tool, pull coupon, terminal or wire route.</text><text x="48" y="680" class="small">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, ASSEMBLY, CONNECTION, POWERED TESTING, MOTION, OR ENERGIZATION</text></svg>