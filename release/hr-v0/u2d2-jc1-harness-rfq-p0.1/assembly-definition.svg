<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='480' viewBox='0 0 1200 480' role='img' aria-labelledby='title desc'><title id='title'>HAR-CTRL cavity map</title><desc id='desc'>Two EHR-3 housings connect cavity 1 ground and cavity 3 data. Cavity 2 is empty at both ends.</desc><style>text{font-family:system-ui,sans-serif;fill:#092f57}.h{font-size:28px;font-weight:800}.t{font-size:18px}.n{font-size:22px;font-weight:800}.box{fill:#dff3ff;stroke:#092f57;stroke-width:4}.g{stroke:#111;stroke-width:12}.d{stroke:#f3bd28;stroke-width:12}.x{stroke:#8d1721;stroke-width:5;stroke-dasharray:14 12}</style><rect width='1200' height='480' fill='#f8fbfe'/><text x='40' y='48' class='h'>HAR-CTRL — numbered connectivity, not visual-orientation inference</text><rect x='70' y='100' width='230' height='280' rx='18' class='box'/><rect x='900' y='100' width='230' height='280' rx='18' class='box'/><text x='120' y='145' class='h'>END A · U2D2</text><text x='930' y='145' class='h'>END B · JC1</text><text x='100' y='220' class='n'>1 · GND</text><text x='100' y='285' class='n'>2 · EMPTY</text><text x='100' y='350' class='n'>3 · DATA</text><text x='930' y='220' class='n'>1 · CTRL_GND</text><text x='930' y='285' class='n'>2 · EMPTY</text><text x='930' y='350' class='n'>3 · DXL_DATA</text><line x1='300' y1='212' x2='900' y2='212' class='g'/><line x1='300' y1='342' x2='900' y2='342' class='d'/><line x1='300' y1='277' x2='900' y2='277' class='x'/><text x='430' y='198' class='t'>BLACK · 3051 BK005 · cavity 1 to 1</text><text x='430' y='330' class='t'>WHITE · 3051 WH005 · cavity 3 to 3</text><text x='428' y='270' class='t'>NO CONTACT · NO CONDUCTOR · NO SPLICE</text><text x='360' y='430' class='t'>500 +/- 5 mm project finished-datum candidate · provider datum reconciliation required</text></svg>