<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">R242 candidate conductor and known duct occupancy</title><desc id="desc">Seven blue candidate conductors in WD5 and segment-specific known occupancy in WD2, with all results held.</desc><style>text{font-family:Arial,sans-serif;fill:#082b4c;font-size:16px}.small{font-size:14px}.label{font-weight:700}.panel{fill:#fff;stroke:#082b4c;stroke-width:3}.duct{fill:#d8f2ff;stroke:#1268a8;stroke-width:3}.wire{stroke:#1578bd;stroke-width:4;fill:none}.gold{fill:#fff0b3;stroke:#9b6d00;stroke-width:3}.hold{fill:#fff7d8;stroke:#9b6d00;stroke-width:3;stroke-dasharray:8 5}</style><rect width="1100" height="720" fill="#f7fbfe"/><text x="35" y="42" class="label">HR-V0-P121-CONDUCTOR-FILL-P0.1 · geometry screen, not a fill approval</text><rect x="70" y="80" width="700" height="590" rx="8" class="panel"/><rect x="130" y="120" width="570" height="55" class="gold"/><text x="150" y="105" class="label">WD5 · 327 mm² usable</text><text x="150" y="210">7 × Ø2.3 mm = 29.09 mm² = 8.90%</text><path d="M160 137 H670 M160 143 H670 M160 149 H670 M160 155 H670 M160 161 H670 M160 167 H670 M160 173 H670" class="wire"/><rect x="630" y="120" width="70" height="520" class="duct"/><text x="720" y="145" class="label">WD2 · 1235 mm² usable</text><text x="720" y="175">Five P1.21 wires traverse the duct.</text><text x="720" y="205">Known worst segment adds six</text><text x="720" y="230">Ø1.6 mm compute wires:</text><text x="720" y="260" class="label">32.84 mm² · 2.66%</text><rect x="815" y="305" width="245" height="150" rx="10" class="hold"/><text x="835" y="338" class="label">Still open</text><text x="835" y="370">Other WD2 occupants</text><text x="835" y="400">Packing · bends · labels</text><text x="835" y="430">Heat · cover · junction</text><text x="90" y="700" class="small">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, ASSEMBLY, CONNECTION, POWERED TESTING, MOTION, OR ENERGIZATION</text></svg>