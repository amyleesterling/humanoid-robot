<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='620' viewBox='0 0 1400 620' role='img' aria-labelledby='title desc'><title id='title'>Six carrier power harnesses</title><desc id='desc'>Three protected branches enter three current limiter carriers and three limited outputs feed the DXL star.</desc><style>text{font-family:system-ui,sans-serif;fill:#092f57}.h{font-size:30px;font-weight:800}.t{font-size:19px}.n{font-size:22px;font-weight:800}.b{fill:#dff3ff;stroke:#092f57;stroke-width:4}.c{fill:#fff4c7;stroke:#092f57;stroke-width:4}.p{stroke:#d69b00;stroke-width:10}.r{stroke:#20252b;stroke-width:10}</style><rect width='1400' height='620' fill='#f8fbfe'/><text x='45' y='55' class='h'>HR-V0 carrier power path — six harnesses, twelve conductors</text><rect x='45' y='105' width='290' height='430' rx='18' class='b'/><text x='75' y='150' class='h'>Blue Sea 5025</text><text x='75' y='205' class='n'>F1.2 + branch return</text><text x='75' y='325' class='n'>F2.2 + branch return</text><text x='75' y='445' class='n'>F3.2 + branch return</text><rect x='565' y='105' width='280' height='430' rx='18' class='c'/><text x='600' y='150' class='h'>Limiter carriers</text><text x='625' y='205' class='n'>LIM1 · JIN1/JOUT1</text><text x='625' y='325' class='n'>LIM2 · JIN1/JOUT1</text><text x='625' y='445' class='n'>LIM3 · JIN1/JOUT1</text><rect x='1080' y='105' width='275' height='430' rx='18' class='b'/><text x='1135' y='150' class='h'>DXL star</text><text x='1160' y='205' class='n'>JP1 · J1</text><text x='1160' y='325' class='n'>JP2 · J2</text><text x='1160' y='445' class='n'>JP3 · G1</text><line x1='335' y1='205' x2='565' y2='205' class='p'/><line x1='845' y1='205' x2='1080' y2='205' class='p'/><text x='355' y='189' class='t'>HAR-CIN-J1</text><text x='865' y='189' class='t'>HAR-COUT-J1</text><line x1='335' y1='325' x2='565' y2='325' class='p'/><line x1='845' y1='325' x2='1080' y2='325' class='p'/><text x='355' y='309' class='t'>HAR-CIN-J2</text><text x='865' y='309' class='t'>HAR-COUT-J2</text><line x1='335' y1='445' x2='565' y2='445' class='p'/><line x1='845' y1='445' x2='1080' y2='445' class='p'/><text x='355' y='429' class='t'>HAR-CIN-G1</text><text x='865' y='429' class='t'>HAR-COUT-G1</text><text x='45' y='585' class='t'>RED positive and BLACK return are independently terminated. Exact cuts, processes, physical circuit positions and every test remain open.</text></svg>