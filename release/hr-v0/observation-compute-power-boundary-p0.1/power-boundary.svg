<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc"><title id="title">Observation compute power boundary</title><desc id="desc">Pi 3V3 powers two ISO1212 devices; four diagnostic outputs pass through series resistors to Pi GPIO. Physical and fault evidence remains open.</desc><style>text{font-family:system-ui,sans-serif;fill:#082b55}.h{font-size:28px;font-weight:800}.m{font-size:18px;font-weight:700}.s{font-size:15px}.b{fill:#eef8ff;stroke:#0b4f8a;stroke-width:3}.p{fill:#fff4c2;stroke:#a06a00;stroke-width:3}.x{fill:#ffe5e5;stroke:#a82323;stroke-width:3}.line{fill:none;stroke:#0b4f8a;stroke-width:7}</style><text x="40" y="45" class="h">Pi 5 observation power and partial-power boundary</text><rect x="40" y="90" width="240" height="180" rx="16" class="b"/><text x="70" y="135" class="m">PI1 / SC1112</text><text x="70" y="175" class="s">pin 17: 3V3 source</text><text x="70" y="205" class="s">pin 20: return</text><text x="70" y="235" class="s">GPIO22-25 inputs</text><rect x="470" y="90" width="260" height="180" rx="16" class="b"/><text x="500" y="135" class="m">R202 receiver</text><text x="500" y="175" class="s">2 x ISO1212</text><text x="500" y="205" class="s">4 x 1k series</text><text x="500" y="235" class="s">4 x 10k fail-low</text><rect x="900" y="90" width="240" height="180" rx="16" class="b"/><text x="930" y="135" class="m">24 V field</text><text x="930" y="175" class="s">4 diagnostic inputs</text><text x="930" y="205" class="s">isolated; zero safety credit</text><path d="M280 140 H470" class="line"/><text x="315" y="125" class="s">3V3 / return</text><path d="M470 220 H280" class="line"/><text x="310" y="250" class="s">4 GPIO inputs</text><path d="M900 180 H730" class="line"/><text x="765" y="165" class="s">isolation barrier</text><rect x="40" y="320" width="520" height="110" rx="14" class="p"/><text x="70" y="360" class="m">Source-bounded screens</text><text x="70" y="392" class="s">steady 3V3 load: 5.00 mA; high floor: 2.364 V</text><text x="70" y="416" class="s">Neither is Pi 5 application approval.</text><rect x="590" y="320" width="550" height="110" rx="14" class="x"/><text x="620" y="360" class="m">BLOCKER: present 1.00k series candidate</text><text x="620" y="392" class="s">hard-short screen: 3.30 to 3.33 mA</text><text x="620" y="416" class="s">TI recommended operation: 3.00 mA at 3.3 V</text><rect x="40" y="475" width="1100" height="100" rx="14" class="p"/><text x="65" y="515" class="m">Pi 5 header-load, GPIO DC limits, back-power, ramp behavior and physical evidence remain OPEN.</text><text x="65" y="550" class="s">PRELIMINARY - NOT APPROVED FOR PROCUREMENT, FABRICATION, ASSEMBLY, CONNECTION, POWERED TESTING, MOTION, OR ENERGIZATION</text></svg>