<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc"><title id="title">HR-30 staged protection architecture</title><desc id="desc">The isolated 5 volt logic-only path is physically separate from the twelve volt whole-body path. The whole-body path contains the source, main protection, dual contactors, five protected feeds, five PDU boards, twenty-five eFuse branches and actuators.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:32px;font-weight:900}.s{font-size:15px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.gold{fill:#fff0b5;stroke:#8a6200;stroke-width:4}.hold{fill:#ffe4e0;stroke:#982520;stroke-width:4}.line{stroke:#0b4f91;stroke-width:6;fill:none}.dash{stroke:#982520;stroke-width:5;stroke-dasharray:13 10;fill:none}</style><rect width="1500" height="980" fill="#eef8ff"/><text class="h" x="50" y="58">HR-30 staged power and protection boundary</text><text x="50" y="96">Two physically separate paths. Every value and physical result shown as open remains unreleased.</text><rect class="gold" x="50" y="150" width="1400" height="220" rx="22"/><text class="h" x="84" y="197">FER-E2 · logic only</text><rect class="box" x="90" y="235" width="270" height="90" rx="14"/><text x="120" y="273">SPD3303X CH1</text><text class="s" x="120" y="301">settings: SELECTION REQUIRED</text><path class="line" d="M360 280H535"/><rect class="box" x="535" y="235" width="300" height="90" rx="14"/><text x="565" y="273">Motion controller J1</text><text class="s" x="565" y="301">AUX_5V_SAFE / CTRL_GND</text><path class="dash" d="M890 230V335"/><text x="925" y="270">Actuator carriers, buses and</text><text x="925" y="302">connectors physically absent</text><rect class="box" x="50" y="425" width="220" height="110" rx="16"/><text x="80" y="468">RSP-500-12</text><text class="s" x="80" y="499">12 V · 41.7 A endpoint</text><path class="line" d="M270 480H360"/><rect class="hold" x="360" y="425" width="210" height="110" rx="16"/><text x="397" y="468">Main fuse F0</text><text class="s" x="397" y="499">SELECTION REQUIRED</text><path class="line" d="M570 480H650"/><rect class="box" x="650" y="425" width="250" height="110" rx="16"/><text x="690" y="468">K1 + K2</text><text class="s" x="690" y="499">dual interruption candidate</text><path class="line" d="M900 480H980"/><rect class="hold" x="980" y="425" width="300" height="110" rx="16"/><text x="1020" y="468">FB1–FB5</text><text class="s" x="1020" y="499">all fuse values required</text><path class="line" d="M1130 535V600"/><rect class="box" x="810" y="600" width="640" height="120" rx="18"/><text class="h" x="850" y="648">Five PDU boards</text><text x="850" y="682">25 TPS25947 eFuse branches · thresholds open</text><path class="line" d="M1130 720V785"/><rect class="box" x="810" y="785" width="640" height="120" rx="18"/><text class="h" x="850" y="833">25 actuator power pairs</text><text x="850" y="868">AWG24 candidate · hot ampacity and protection open</text><rect class="hold" x="50" y="600" width="650" height="305" rx="20"/><text class="h" x="90" y="650">System constraints</text><text x="90" y="700">Candidate current-cap sum: 46.678 A</text><text x="90" y="742">Source continuous endpoint: 41.7 A</text><text x="90" y="784">Published stall-endpoint sum: 71.88 A</text><text x="90" y="835">Reverse-blocking eFuses do not provide a</text><text x="90" y="870">released regenerative-energy path.</text><text class="s" x="50" y="950">PRELIMINARY · no procurement, connection, powered-test, motion or energization authority</text></svg>