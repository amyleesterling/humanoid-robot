<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#f7fbff"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#0b1d35}.h{font-size:36px;font-weight:900}.t{font-size:18px;font-weight:800}.s{font-size:14px}.box{fill:#fff;stroke:#082d67;stroke-width:3}.fixture{fill:#e4f6ff;stroke:#145ca8;stroke-width:4}.wire{stroke:#145ca8;stroke-width:5;fill:none}.ref{stroke:#d39b00;stroke-width:5;fill:none}.warn{fill:#ffc83d;stroke:#6e4d00;stroke-width:3}</style><text class="h" x="48" y="56">Off-robot calibration of one complete floating measurement lane</text><rect class="warn" x="48" y="78" width="1504" height="58" rx="10"/><text class="t" x="72" y="113">UNBUILT - ROBOT CONNECTION PROHIBITED - NUMERIC ACCEPTANCE LIMITS OPEN - ZERO SAFETY CREDIT</text><rect class="box" x="55" y="270" width="245" height="150" rx="16"/><text class="t" x="80" y="312">Keysight E36313A</text><text class="s" x="80" y="345">Output 2 or 3 / isolated check</text><text class="s" x="80" y="375">0-24 V points / 10 mA candidate</text><rect class="fixture" x="365" y="235" width="320" height="220" rx="18"/><text class="t" x="392" y="280">Passive calibration fixture</text><text class="s" x="392" y="315">JPS source - JDMM monitor - JDUT out</text><text class="s" x="392" y="345">104 x 76 mm routed PCB</text><text class="s" x="392" y="375">1591GFLBK envelope candidate</text><path class="wire" d="M300 330 H365"/><rect class="box" x="390" y="520" width="270" height="120" rx="16"/><text class="t" x="420" y="560">Fluke 87V MAX CAL</text><text class="s" x="420" y="590">Actual source reference at JDMM</text><path class="ref" d="M525 520 V455"/><rect class="box" x="755" y="270" width="205" height="150" rx="16"/><text class="t" x="785" y="312">One DP pod</text><text class="s" x="785" y="345">2 x 100 kOhm / lead</text><text class="s" x="785" y="375">source tail disconnected</text><path class="wire" d="M685 330 H755"/><rect class="box" x="1025" y="270" width="205" height="150" rx="16"/><text class="t" x="1055" y="312">3 m cable + panel</text><text class="s" x="1055" y="345">one floating lane</text><text class="s" x="1055" y="375">10.2 kOhm / lead</text><path class="wire" d="M960 330 H1025"/><rect class="box" x="1295" y="270" width="250" height="150" rx="16"/><text class="t" x="1325" y="312">NI-9229 channel</text><text class="s" x="1325" y="345">raw differential samples</text><text class="s" x="1325" y="375">gain/offset/uncertainty fit</text><path class="wire" d="M1230 330 H1295"/><text class="t" x="55" y="700">Repeat sequentially for CH-AI-01 through CH-AI-08. Seven fixture inputs remain disconnected at every run.</text></svg>
