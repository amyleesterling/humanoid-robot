<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="t d"><title id="t">HR-30 one-axis commissioning station</title><desc id="d">A safety-listed current-limited bench supply feeds one U2D2 Power Hub and exactly one disconnected DYNAMIXEL actuator. First power is read only and torque remains disabled.</desc><style>text{font-family:system-ui,sans-serif;fill:#082f58}.box{fill:white;stroke:#14689c;stroke-width:4}.safe{fill:#d6f1ff}.gold{fill:#fff0b5}.line{stroke:#14689c;stroke-width:7;fill:none;marker-end:url(#a)}.h{font-size:28px;font-weight:800}.b{font-size:19px}.s{font-size:14px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#14689c"/></marker></defs><rect width="1500" height="720" fill="#f8fcff"/><text x="40" y="45" class="h">PRELIMINARY - SUPPORT EQUIPMENT CANDIDATE - NOT APPROVED FOR CONNECTION, POWERED TESTING, MOTION, OR ENERGIZATION</text><rect class="box safe" x="55" y="110" width="300" height="180" rx="20"/><text x="85" y="155" class="h">Keysight E36313A</text><text x="85" y="195" class="b">Output 2 or 3 only</text><text x="85" y="230" class="b">11.0 V · 0.25 A first power</text><text x="85" y="265" class="s">UL / CSA / IEC 61010-1</text><path class="line" d="M355 200H505"/><rect class="box gold" x="520" y="90" width="390" height="230" rx="20"/><text x="550" y="140" class="h">U2D2 + Power Hub</text><text x="550" y="185" class="b">Mini-Fit input only</text><text x="550" y="220" class="b">Barrel and screw input EMPTY</text><text x="550" y="255" class="b">One X3P or X4P DUT cable</text><path class="line" d="M910 200H1060"/><rect class="box" x="1075" y="110" width="360" height="180" rx="20"/><text x="1105" y="155" class="h">ONE actuator</text><text x="1105" y="195" class="b">Disconnected from robot harness</text><text x="1105" y="230" class="b">Output mechanically restrained</text><text x="1105" y="265" class="b">Torque Enable = 0</text><rect class="box" x="320" y="410" width="860" height="220" rx="24"/><text x="365" y="462" class="h">First power permits reads—not motion.</text><text x="365" y="510" class="b">Read: model · firmware · voltage · temperature · hardware error · Torque Enable</text><text x="365" y="555" class="b">Never send: goal position · velocity · current · PWM · reboot · reset · firmware update</text><text x="365" y="600" class="b">Any anomaly → supply output OFF → PHB OFF → investigate</text></svg>