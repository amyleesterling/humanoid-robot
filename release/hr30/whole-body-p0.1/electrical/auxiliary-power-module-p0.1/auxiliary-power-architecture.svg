<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">HR-30 three-rail auxiliary power architecture</title><desc id="desc">Three protected twelve volt inputs feed three isolated thirty watt converters and separate compute, HMI and control five volt rails. All secondary returns meet at one star.</desc><style>text{font:600 18px system-ui;fill:#102b46}.title{font-size:36px;font-weight:900}.sub{font-size:23px;font-weight:800}.small{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.hold{fill:#fff0b5;stroke:#8d241f;stroke-width:4}.line{stroke:#0b4f91;stroke-width:6;fill:none}.ret{stroke:#17243a;stroke-width:7;fill:none}</style><rect width="1500" height="820" fill="#eef8fe"/><text class="title" x="55" y="58">HR-30 auxiliary power: three explicit fault domains</text><rect class="hold" x="55" y="84" width="1390" height="66" rx="14"/><text x="80" y="124">UNBUILT — fuse, reverse/inrush, PE bond, harness, thermal and load validation remain OPEN</text><g transform="translate(0,190)"><rect class="box" x="70" y="0" width="190" height="105" rx="16"/><text class="sub" x="95" y="39">Compute input</text><text class="small" x="95" y="73">9-36 V module range</text><path class="line" d="M260 53H330"/><rect class="hold" x="330" y="0" width="230" height="105" rx="16"/><text x="355" y="39">Fuse + reverse/inrush</text><text class="small" x="355" y="73">SELECTION REQUIRED</text><path class="line" d="M560 53H630"/><rect class="box" x="630" y="0" width="230" height="105" rx="16"/><text class="sub" x="655" y="39">REC30E-2405SZ</text><text class="small" x="655" y="73">30 W · 5 V · 6 A · isolated</text><path class="line" d="M860 53H930"/><rect class="box" x="930" y="0" width="430" height="105" rx="16"/><text class="sub" x="955" y="39">COMPUTE_5V1</text><text class="small" x="955" y="73">coarse peak 27 W · margin 3 W</text><path class="ret" d="M745 105V500H1180"/></g><g transform="translate(0,345)"><rect class="box" x="70" y="0" width="190" height="105" rx="16"/><text class="sub" x="95" y="39">Face / HMI input</text><text class="small" x="95" y="73">9-36 V module range</text><path class="line" d="M260 53H330"/><rect class="hold" x="330" y="0" width="230" height="105" rx="16"/><text x="355" y="39">Fuse + reverse/inrush</text><text class="small" x="355" y="73">SELECTION REQUIRED</text><path class="line" d="M560 53H630"/><rect class="box" x="630" y="0" width="230" height="105" rx="16"/><text class="sub" x="655" y="39">REC30E-2405SZ</text><text class="small" x="655" y="73">30 W · 5 V · 6 A · isolated</text><path class="line" d="M860 53H930"/><rect class="box" x="930" y="0" width="430" height="105" rx="16"/><text class="sub" x="955" y="39">HMI_5V0</text><text class="small" x="955" y="73">coarse peak 30 W · margin 0 W</text><path class="ret" d="M745 105V345H1180"/></g><g transform="translate(0,500)"><rect class="box" x="70" y="0" width="190" height="105" rx="16"/><text class="sub" x="95" y="39">Control input</text><text class="small" x="95" y="73">9-36 V module range</text><path class="line" d="M260 53H330"/><rect class="hold" x="330" y="0" width="230" height="105" rx="16"/><text x="355" y="39">Fuse + reverse/inrush</text><text class="small" x="355" y="73">SELECTION REQUIRED</text><path class="line" d="M560 53H630"/><rect class="box" x="630" y="0" width="230" height="105" rx="16"/><text class="sub" x="655" y="39">REC30E-2405SZ</text><text class="small" x="655" y="73">30 W · 5 V · 6 A · isolated</text><path class="line" d="M860 53H930"/><rect class="box" x="930" y="0" width="430" height="105" rx="16"/><text class="sub" x="955" y="39">AUX_5V_SAFE</text><text class="small" x="955" y="73">coarse peak 15 W · margin 15 W</text><path class="ret" d="M745 105V190H1180"/></g><path class="ret" d="M745 760H1180"/><rect class="box" x="1180" y="690" width="250" height="110" rx="18"/><text class="sub" x="1205" y="732">AUX_0V_STAR</text><text class="small" x="1205" y="766">PE bond: SELECTION REQUIRED</text></svg>