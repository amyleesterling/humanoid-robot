<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">HR-30 physical protective-bonding candidate</title><desc id="desc">Candidate panel and robot protective-earth implementation with selected interface families and unresolved conductor sizing.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:31px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.pe{stroke:#16804a;stroke-width:10;fill:none}.open{stroke:#f2b91d;stroke-width:8;stroke-dasharray:16 10;fill:none}.warn{fill:#fff0b5;stroke:#982520;stroke-width:4}</style><rect width="1600" height="940" fill="#eef8ff"/><text class="h" x="45" y="56">Physical protective-bonding candidate — unbuilt, unmeasured, unauthorized</text><rect class="box" x="45" y="115" width="435" height="430" rx="18"/><text x="75" y="158">External Hammond 1418N4C6 panel</text><text class="s" x="75" y="196">PB-HW03: UT 10-PE / 3044173 candidate hub</text><text class="s" x="75" y="230">factory body grounding stud</text><text class="s" x="75" y="264">factory door bonding stud + jumper (open)</text><text class="s" x="75" y="298">RSP-500-12 FG + SD-15A-24 FG</text><text class="s" x="75" y="332">PB-HW04: Alpha 460619 6 AWG family</text><text class="s" x="75" y="366">exact green/yellow order code: open</text><text class="s" x="75" y="400">fault/clearing/route sizing: open</text><rect class="box" x="600" y="115" width="360" height="260" rx="18"/><text x="630" y="158">Tether boundary</text><text class="s" x="630" y="198">SBS75GBLK center G cavity</text><text class="s" x="630" y="232">1340G1 6 AWG pre-mate contact</text><text class="s" x="630" y="266">tool/die/crimp/pull test: open</text><path class="pe" d="M480 260H600"/><rect class="box" x="1080" y="115" width="470" height="430" rx="18"/><text x="1110" y="158">Robot pelvis frame-bond hub</text><text class="s" x="1110" y="198">exact hub and fasteners: selection required</text><text class="s" x="1110" y="232">14 moving-joint bypass obligations</text><text class="s" x="1110" y="266">bearings/joints receive zero bond credit</text><text class="s" x="1110" y="300">head, torso, arms, hands, legs and feet</text><text class="s" x="1110" y="334">must pass worst-pose continuity</text><path class="pe" d="M960 260H1080"/><rect class="box" x="600" y="610" width="360" height="150" rx="18"/><text x="630" y="655">Robot DC return bus RB0</text><text class="s" x="630" y="694">normal current stays off frame</text><path class="open" d="M780 610V375"/><text x="805" y="515">BR1 — sole proposed link</text><text class="s" x="805" y="546">hardware + approval open</text><rect class="warn" x="45" y="820" width="1505" height="80" rx="18"/><text x="75" y="857">No conductor size is released until fault current, clearing time, route, ambient, flex, terminal limits and jurisdiction are frozen.</text><text class="s" x="75" y="884">No installation, test, connection or energization authority follows from this drawing.</text></svg>