<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">HR-30 protective-earth and DC-reference candidate</title><desc id="desc">Protective earth travels from the facility through the external enclosure and first-mate tether contact to a robot frame bond hub. DC return remains separate except for one proposed removable bond at the robot distributor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b4f91"/></marker></defs><style>text{font:600 19px system-ui;fill:#102b46}.h{font-size:31px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.pe{stroke:#16804a;stroke-width:11;fill:none}.dc{stroke:#17243a;stroke-width:9;fill:none}.bond{stroke:#f2b91d;stroke-width:9;stroke-dasharray:16 10}.hold{fill:#fff0b5;stroke:#982520;stroke-width:4}</style><rect width="1500" height="850" fill="#eef8ff"/><text class="h" x="45" y="55">Whole-robot PE / DC-reference candidate — nothing is built or approved</text><rect class="box" x="45" y="115" width="280" height="220" rx="18"/><text x="75" y="160">Facility PE</text><text class="s" x="75" y="195">site + branch assumptions open</text><rect class="box" x="410" y="100" width="340" height="260" rx="18"/><text x="445" y="145">External panel PE bar</text><text class="s" x="445" y="182">enclosure bond</text><text class="s" x="445" y="212">RSP-500-12 FG</text><text class="s" x="445" y="242">SD-15A-24 FG</text><text class="s" x="445" y="272">XT1A SBS75G G</text><path class="pe" d="M325 230H410"/><rect class="box" x="850" y="100" width="300" height="260" rx="18"/><text x="885" y="145">Pelvis frame-bond hub</text><text class="s" x="885" y="182">via XT1B SBS75G G</text><text class="s" x="885" y="220">jumpers to every conductive</text><text class="s" x="885" y="250">whole-body module</text><path class="pe" d="M750 230H850"/><rect class="box" x="1225" y="100" width="230" height="260" rx="18"/><text x="1260" y="145">Robot frame</text><text class="s" x="1260" y="185">head + torso</text><text class="s" x="1260" y="215">arms + pelvis</text><text class="s" x="1260" y="245">legs + feet</text><path class="pe" d="M1150 230H1225"/><rect class="box" x="410" y="470" width="340" height="170" rx="18"/><text x="445" y="515">RSP +12 V / DC return</text><text class="s" x="445" y="552">power pair through tether P1/P2</text><text class="s" x="445" y="584">frame is not a normal-current path</text><rect class="box" x="850" y="470" width="300" height="170" rx="18"/><text x="885" y="515">Robot return bus RB0</text><text class="s" x="885" y="552">actuator return + CTRL_GND</text><text class="s" x="885" y="584">reference topology still open</text><path class="dc" d="M750 555H850"/><path class="bond" d="M1000 470V360"/><text x="1025" y="425">BR1</text><text class="s" x="1025" y="450">sole proposed bond</text><rect class="hold" x="45" y="705" width="1410" height="100" rx="18"/><text x="80" y="747">USB, SWD and oscilloscope grounds can create a second bond. Connection matrix review is mandatory.</text><text class="s" x="80" y="780">Conductor sizes, terminals, limits, enclosure/jurisdiction assumptions, physical tests and qualified approval remain open.</text></svg>