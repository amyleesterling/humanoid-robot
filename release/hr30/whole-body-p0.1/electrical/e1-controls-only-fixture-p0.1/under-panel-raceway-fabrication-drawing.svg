<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="#eef8fe"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#142a40}.title{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:750}.t{font-size:16px}.d{stroke:#0b4f91;stroke-width:2;fill:none}.part{stroke:#071d36;stroke-width:3;fill:#dff4ff}.gold{fill:#f2b91d;stroke:#805600;stroke-width:2}</style><rect x="24" y="22" width="1152" height="56" rx="10" class="gold"/><text x="44" y="58" class="h">PRELIMINARY - UNBUILT E1 FIXTURE HARDWARE CANDIDATE - NOT APPROVED FOR CONNECTION, POWERED TESTING, MOTION, WALKING, OR ENERGIZATION</text><text x="40" y="122" class="title">Under-panel logic-cable raceway candidate</text><rect x="175" y="275" width="735" height="300" class="part"/><rect x="187" y="287" width="711" height="264" fill="white" stroke="#0b4f91" stroke-width="2"/><text x="440" y="430" class="h">245 x 150 x 16 mm</text><text x="440" y="465" class="t">2 mm base and walls; OPEN TOP</text><text x="940" y="300" class="t">Mechanically fasten corners</text><text x="940" y="345" class="t">or qualify a bond process</text><text x="940" y="390" class="t">No loose chips or sharp edges</text><text x="940" y="435" class="t">General +/-0.30 mm</text></svg>