<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="910" viewBox="0 0 1580 910" role="img"><style>.h{font:900 34px system-ui}.id{font:800 21px system-ui}.t{font:700 17px system-ui}.s{font:600 15px system-ui}</style><rect width="1580" height="910" fill="#eef8ff"/><text x="55" y="58" class="h" fill="#082d67">Seven controlled leads - one normal cable, four unmistakable fault tools</text><text x="55" y="100" class="t" fill="#102b46">Every connection change occurs with the source output OFF. No cable may connect to the robot.</text><rect x="60" y="150" width="700" height="145" rx="18" fill="#f2b91d" stroke="#082d67" stroke-width="4"/><text x="84" y="186" class="id" fill="#102b46">CK-01 · isolated source lead pair</text><text x="84" y="222" class="t" fill="#102b46">Keysight output 2 or 3 to fixture JPS</text><text x="84" y="258" class="s" fill="#102b46">975 target; record actual; 950 minimum</text><rect x="820" y="150" width="700" height="145" rx="18" fill="#72c8f0" stroke="#082d67" stroke-width="4"/><text x="844" y="186" class="id" fill="#102b46">CK-02 · normal transfer cable</text><text x="844" y="222" class="t" fill="#102b46">fixture JDUT to selected pod JIN</text><text x="844" y="258" class="s" fill="#102b46">300 +/-5 jacket span</text><rect x="60" y="335" width="700" height="145" rx="18" fill="#ff7b6e" stroke="#082d67" stroke-width="4"/><text x="84" y="371" class="id" fill="#102b46">CK-03 · reversed-polarity adapter</text><text x="84" y="407" class="t" fill="#102b46">controlled negative-response characterization</text><text x="84" y="443" class="s" fill="#102b46">300 +/-5 jacket span</text><rect x="820" y="335" width="700" height="145" rx="18" fill="#ffb14d" stroke="#082d67" stroke-width="4"/><text x="844" y="371" class="id" fill="#102b46">CK-04 · HI-open adapter</text><text x="844" y="407" class="t" fill="#102b46">controlled CAL_HI open characterization</text><text x="844" y="443" class="s" fill="#102b46">300 +/-5 jacket span</text><rect x="60" y="520" width="700" height="145" rx="18" fill="#ffb14d" stroke="#082d67" stroke-width="4"/><text x="84" y="556" class="id" fill="#102b46">CK-05 · LO-open adapter</text><text x="84" y="592" class="t" fill="#102b46">controlled CAL_LO open characterization</text><text x="84" y="628" class="s" fill="#102b46">300 +/-5 jacket span</text><rect x="820" y="520" width="700" height="145" rx="18" fill="#1b2735" stroke="#082d67" stroke-width="4"/><text x="844" y="556" class="id" fill="#fff">CK-06 · current-limit shorting adapter</text><text x="844" y="592" class="t" fill="#fff">controlled CAL_HI-to-CAL_LO short at JDUT</text><text x="844" y="628" class="s" fill="#fff">80 +/-5 conductor before termination</text><rect x="60" y="705" width="700" height="145" rx="18" fill="#65c985" stroke="#082d67" stroke-width="4"/><text x="84" y="741" class="id" fill="#102b46">CK-07 · reference-DMM patch pair</text><text x="84" y="777" class="t" fill="#102b46">fixture JHI/JLO to Fluke V/ohm and COM</text><text x="84" y="813" class="s" fill="#102b46">610 manufacturer nominal</text><text x="820" y="845" class="t" fill="#982520">CK-03 through CK-06 live in a separate FAULT ADAPTER compartment.</text></svg>
