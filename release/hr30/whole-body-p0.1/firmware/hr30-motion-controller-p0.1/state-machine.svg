<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">HR-30 first-power no-motion state machine</title><desc id="desc">Boot hold advances to safe hold and permit-observed no-motion. Any fault reaches a latched fault. Reset is possible only with permit low and all outputs inactive.</desc><style>text{font:600 18px system-ui;fill:#102a43}.title{font-size:30px;font-weight:900}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.fault{fill:#fff0b5;stroke:#982520}.arrow{stroke:#0b4f91;stroke-width:4;fill:none;marker-end:url(#m)}.label{font-size:15px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b4f91"/></marker></defs><text class="title" x="45" y="50">FIRST_POWER_NO_MOTION</text><rect class="box" x="55" y="120" rx="18" width="235" height="120"/><text x="92" y="177">BOOT_HOLD</text><text class="label" x="82" y="207">3 valid samples; outputs 0</text><rect class="box" x="385" y="120" rx="18" width="235" height="120"/><text x="430" y="177">SAFE_HOLD</text><text class="label" x="423" y="207">permit low; outputs 0</text><rect class="box" x="715" y="120" rx="18" width="390" height="120"/><text x="760" y="167">PERMIT_OBSERVED</text><text class="label" x="760" y="200">still no torque, bus TX, precharge or motion</text><rect class="box fault" x="385" y="350" rx="18" width="390" height="120"/><text x="490" y="407">LATCHED_FAULT</text><text class="label" x="450" y="440">reset only de-energized; outputs remain 0</text><path class="arrow" d="M290 180H385"/><text class="label" x="308" y="165">validated</text><path class="arrow" d="M620 180H715"/><text class="label" x="642" y="165">permit</text><path class="arrow" d="M200 240Q250 410 385 410"/><path class="arrow" d="M500 240V350"/><path class="arrow" d="M910 240Q870 410 775 410"/><text class="label" x="810" y="330">any monitored fault</text><path class="arrow" d="M385 445Q300 470 310 250Q315 210 385 210"/><text class="label" x="95" y="485">explicit reset + permit low + zero observed activity</text></svg>