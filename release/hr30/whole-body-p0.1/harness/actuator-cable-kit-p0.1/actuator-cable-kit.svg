<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">HR-30 actuator cable-kit architecture</title><desc id="desc">Each actuator receives an individual protected power pair and serial data. Outgoing inter-actuator connectors omit ground and voltage contacts.</desc><style>text{font:600 18px system-ui;fill:#102b46}.h{font-size:34px;font-weight:900}.s{font-size:16px}.box{fill:#fff;stroke:#0b4f91;stroke-width:4}.data{stroke:#28a9df;stroke-width:8;fill:none}.power{stroke:#f2b91d;stroke-width:9;fill:none}.empty{fill:#fff;stroke:#982520;stroke-width:5}.pin{fill:#d9f2ff;stroke:#0b4f91;stroke-width:3}.warn{fill:#fff0b5;stroke:#982520;stroke-width:4}</style><rect width="1600" height="980" fill="#eef8ff"/><text class="h" x="50" y="60">HR-30 split actuator harness candidate</text><rect class="box" x="55" y="180" width="330" height="270" rx="20"/><text x="90" y="225">25-channel protected PDU</text><text class="s" x="90" y="270">one positive + return pair per axis</text><text class="s" x="90" y="310">candidate internal cap &lt;= 2.499 A</text><text class="s" x="90" y="350">branch protection: selection required</text><rect class="box" x="620" y="130" width="390" height="380" rx="20"/><text x="655" y="175">Actuator input EHR-4 / EHR-3</text><circle class="pin" cx="690" cy="235" r="24"/><text x="680" y="242">1</text><text class="s" x="735" y="242">GND - individual return</text><circle class="pin" cx="690" cy="300" r="24"/><text x="680" y="307">2</text><text class="s" x="735" y="307">VDD - individual protected feed</text><circle class="pin" cx="690" cy="365" r="24"/><text x="680" y="372">3</text><text class="s" x="735" y="372">DATA / DATA+</text><circle class="pin" cx="690" cy="430" r="24"/><text x="680" y="437">4</text><text class="s" x="735" y="437">DATA- on RS-485 only</text><path class="power" d="M385 270 C500 270 520 235 620 235"/><path class="power" d="M385 340 C500 340 520 300 620 300"/><rect class="box" x="1160" y="130" width="370" height="380" rx="20"/><text x="1195" y="175">Outgoing data-only housing</text><circle class="empty" cx="1230" cy="235" r="24"/><text x="1220" y="242">1</text><text class="s" x="1275" y="242">EMPTY - no GND pass-through</text><circle class="empty" cx="1230" cy="300" r="24"/><text x="1220" y="307">2</text><text class="s" x="1275" y="307">EMPTY - no VDD pass-through</text><circle class="pin" cx="1230" cy="365" r="24"/><text x="1220" y="372">3</text><text class="s" x="1275" y="372">DATA / DATA+</text><circle class="pin" cx="1230" cy="430" r="24"/><text x="1220" y="437">4</text><text class="s" x="1275" y="437">DATA- on RS-485 only</text><path class="data" d="M1010 365 L1160 365"/><path class="data" d="M1010 430 L1160 430"/><rect class="warn" x="110" y="610" width="1380" height="230" rx="20"/><text class="h" x="155" y="665">Candidate advanced; release gates remain open</text><text x="155" y="720">CF9.UL.02.02 at 0.25 mm2 fits JST's published 0.032-0.33 mm2 contact range.</text><text x="155" y="765">The 3 A JST headline applies at AWG22, not this AWG24 candidate. Hot/bundled ampacity remains unproven.</text><text x="155" y="810">No cable is approved to crimp, connect or energize.</text><text class="s" x="50" y="940">PRELIMINARY - UNBUILT ACTUATOR CABLE-KIT CANDIDATE - NOT APPROVED FOR PROCUREMENT, FABRICATION, CONNECTION, POWERED TESTING, MOTION OR ENERGIZATION</text></svg>