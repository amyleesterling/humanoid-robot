<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">HR-30 whole-body power route guides</title><desc id="desc">Six dimensioned external guarded trunk candidates with exact tangent bend radii.</desc><rect width="1600" height="1240" fill="#eef8ff"/><text x="70" y="72" font-size="44" font-weight="900" fill="#071d36">Six real routed trunks, not six straight placeholders.</text><text x="70" y="112" font-size="20" fill="#24425f">Each path preserves its P0.1 endpoints and adds two exact tangent circular guides sized at 8× maximum cable OD.</text><rect x="70" y="140" width="1460" height="72" rx="14" fill="#f2b91d" stroke="#805600" stroke-width="3"/><text x="96" y="184" font-size="19" font-weight="900" fill="#17243a">PRELIMINARY · EXTERNAL GUARDED-SPINE CANDIDATE · COLLISION, SNAG, MOTION, CLAMP, THERMAL AND PHYSICAL PROOF OPEN</text><g transform="translate(70 730)"><rect width="1460" height="120" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="32" font-size="20" font-weight="800" fill="#071d36">HN01_HEAD_POWER_BRANCH</text><text x="24" y="64" font-size="16" fill="#24425f">861804 · 2 axes · max OD 6.2992 mm</text><path d="M 520 88 A 50.4 50.4 0 0 1 570.4 37.6 H 1209.6 A 50.4 50.4 0 0 1 1260 88" fill="none" stroke="#f2b91d" stroke-width="12" stroke-linecap="round"/><text x="520" y="108" font-size="15" fill="#0b4f91">two tangent R50.4 guides · 183.961 mm centerline</text><rect x="1280" y="28" width="150" height="44" rx="22" fill="#dff5e8" stroke="#147348" stroke-width="2"/><text x="1355" y="56" text-anchor="middle" font-size="17" font-weight="800" fill="#0a5b38">RADIUS PASS</text></g><g transform="translate(70 1050)"><rect width="1460" height="120" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="32" font-size="20" font-weight="800" fill="#071d36">HN01_L_ARM_POWER</text><text x="24" y="64" font-size="16" fill="#24425f">861812 · 5 axes · 