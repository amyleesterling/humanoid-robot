<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="t d"><title id="t">HR-30 complete actuator transition coupon</title><desc id="d">Moving CF130 cable passes through a fixed Micro-Fit panel transition and restrained Alpha 3051 pigtail before JST EH.</desc><rect width="1440" height="720" fill="#f7fbff"/><rect x="30" y="24" width="1380" height="94" rx="14" fill="#f2b91d" stroke="#805600" stroke-width="3"/><g font-family="system-ui" font-size="21" font-weight="800" fill="#17243a"><text x="60" y="64">PRELIMINARY - UNBUILT COMPLETE TRANSITION COUPON</text><text x="60" y="96">NO PROCUREMENT, FABRICATION, CONNECTION, POWERED TEST, MOTION OR ENERGIZATION</text></g><g font-family="system-ui" fill="#142a40"><text x="60" y="170" font-size="34" font-weight="900">Coupon construction</text><rect x="50" y="210" width="260" height="155" rx="18" fill="#d9f2ff" stroke="#0b4f91" stroke-width="3"/><text x="78" y="255" font-size="22" font-weight="800">Moving CF130</text><text x="78" y="295" font-size="18">2 x 22 AWG</text><text x="78" y="330" font-size="18">bend/torsion zone</text><path d="M310 286 H410" stroke="#0b4f91" stroke-width="7"/><rect x="410" y="190" width="390" height="195" rx="18" fill="#fff" stroke="#0b4f91" stroke-width="3"/><text x="440" y="235" font-size="22" font-weight="800">Fixed Micro-Fit panel pair</text><text x="440" y="275" font-size="18">430250200 + 430300001</text><text x="440" y="310" font-size="18">430200200 + 430310001</text><text x="440" y="345" font-size="18">representative bracket + clamps</text><path d="M800 286 H900" stroke="#0b4f91" stroke-width="7"/><rect x="900" y="210" width="260" height="155" rx="18" fill="#d9f2ff" stroke="#0b4f91" stroke-width="3"/><text x="930" y="255" font-size="22" font-weight="800">Alpha 3051 pigtail</text><text x="930" y="295" font-size="18">restrained / static</text><text x="930" y="330" font-size="18">no joint flex</text><path d="M1160 286 H1230" stroke="#0b4f91" stroke-width="7"/><rect x="1230" y="225" width="160" height="120" rx="18" fill="#fff" stroke="#0b4f91" stroke-width="3"/><text x="1260" y="275" font-size="22" font-weight="800">JST EH</text><text x="1260" y="315" font-size="18">actuator</text><rect x="150" y="465" width="1140" height="150" rx="18" fill="#071d36"/><text x="720" y="510" text-anchor="middle" font-size="23" fill="#fff" font-weight="800">Cycle CF130 while measuring panel motion, pigtail strain, resistance and temperature</text><text x="720" y="550" text-anchor="middle" font-size="21" fill="#fff">0 coupons built | 0 tests executed | 0 final cut lengths released</text><text x="720" y="590" text-anchor="middle" font-size="18" fill="#f2b91d">Direct CF130-to-JST crimping is rejected</text></g></svg>