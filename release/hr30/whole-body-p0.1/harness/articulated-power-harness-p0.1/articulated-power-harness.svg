<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">HR-30 articulated direct-branch power harness</title><desc id="desc">Six whole-body corridors with 25 direct protected branches and 76 explicit joint crossings.</desc><rect width="1600" height="1050" fill="#eef8ff"/><text x="70" y="70" font-size="46" font-weight="900" fill="#071d36">One protected pair per actuator. No intermediate tap boards.</text><text x="70" y="112" font-size="20" fill="#24425f">A distal branch crosses every upstream joint before reaching its one fixed transition; rigid guards stop before every axis.</text><rect x="70" y="135" width="1460" height="56" rx="14" fill="#f2b91d" stroke="#805600" stroke-width="3"/><text x="96" y="171" font-size="18" font-weight="900" fill="#17243a">PRELIMINARY · 37.5 mm NOMINAL CATALOG-RADIUS INPUT · FULL-POSE COLLISION, FLEX, DERATING AND PHYSICAL PROOF OPEN</text><g transform="translate(70 210)"><rect width="1460" height="100" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="34" font-size="21" font-weight="800" fill="#071d36">HN01_TORSO_POWER_SPINE</text><text x="24" y="70" font-size="17" fill="#24425f">1 direct branches · 1 joint-crossing segments · max 1 parallel pairs</text><path d="M 760 52 H 1330" stroke="#f2b91d" stroke-width="14"/><circle cx="840" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1020" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1200" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><text x="1385" y="59" text-anchor="middle" font-size="16" font-weight="800" fill="#147348">NO SPLICES</text></g><g transform="translate(70 335)"><rect width="1460" height="100" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="34" font-size="21" font-weight="800" fill="#071d36">HN01_HEAD_POWER_BRANCH</text><text x="24" y="70" font-size="17" fill="#24425f">2 direct branches · 3 joint-crossing segments · max 2 parallel pairs</text><path d="M 760 52 H 1330" stroke="#f2b91d" stroke-width="14"/><circle cx="840" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1020" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1200" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><text x="1385" y="59" text-anchor="middle" font-size="16" font-weight="800" fill="#147348">NO SPLICES</text></g><g transform="translate(70 460)"><rect width="1460" height="100" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="34" font-size="21" font-weight="800" fill="#071d36">HN01_L_ARM_POWER</text><text x="24" y="70" font-size="17" fill="#24425f">5 direct branches · 15 joint-crossing segments · max 5 parallel pairs</text><path d="M 760 52 H 1330" stroke="#f2b91d" stroke-width="14"/><circle cx="840" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1020" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1200" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><text x="1385" y="59" text-anchor="middle" font-size="16" font-weight="800" fill="#147348">NO SPLICES</text></g><g transform="translate(70 585)"><rect width="1460" height="100" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="34" font-size="21" font-weight="800" fill="#071d36">HN01_R_ARM_POWER</text><text x="24" y="70" font-size="17" fill="#24425f">5 direct branches · 15 joint-crossing segments · max 5 parallel pairs</text><path d="M 760 52 H 1330" stroke="#f2b91d" stroke-width="14"/><circle cx="840" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1020" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1200" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><text x="1385" y="59" text-anchor="middle" font-size="16" font-weight="800" fill="#147348">NO SPLICES</text></g><g transform="translate(70 710)"><rect width="1460" height="100" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="34" font-size="21" font-weight="800" fill="#071d36">HN01_L_LEG_POWER</text><text x="24" y="70" font-size="17" fill="#24425f">6 direct branches · 21 joint-crossing segments · max 6 parallel pairs</text><path d="M 760 52 H 1330" stroke="#f2b91d" stroke-width="14"/><circle cx="840" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1020" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1200" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><text x="1385" y="59" text-anchor="middle" font-size="16" font-weight="800" fill="#147348">NO SPLICES</text></g><g transform="translate(70 835)"><rect width="1460" height="100" rx="18" fill="#fff" stroke="#82c4e6" stroke-width="3"/><text x="24" y="34" font-size="21" font-weight="800" fill="#071d36">HN01_R_LEG_POWER</text><text x="24" y="70" font-size="17" fill="#24425f">6 direct branches · 21 joint-crossing segments · max 6 parallel pairs</text><path d="M 760 52 H 1330" stroke="#f2b91d" stroke-width="14"/><circle cx="840" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1020" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><circle cx="1200" cy="52" r="28" fill="none" stroke="#0b4f91" stroke-width="8"/><text x="1385" y="59" text-anchor="middle" font-size="16" font-weight="800" fill="#147348">NO SPLICES</text></g></svg>